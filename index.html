<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ANNIVERSAIRES — 誕生日スペシャル</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0a0a0c">
    <meta name="description" content="Suivez les anniversaires de l'équipe — édition manga.">
    <link rel="apple-touch-icon" href="icons/icon-192.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Noto+Sans+JP:wght@500;700;900&family=Inter+Tight:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            /* Palette manga — encre profonde + rouge shōnen */
            --bg: #0a0a0c;
            --bg-elev: #131318;
            --bg-elev-2: #1b1b22;
            --ink: #f2efe9;
            --ink-dim: #a5a29b;
            --ink-mute: #5b5952;
            --line: rgba(242, 239, 233, 0.1);
            --line-strong: rgba(242, 239, 233, 0.25);
            --border-ink: rgba(242, 239, 233, 0.85);
            --accent: #e8332e;
            --accent-dark: #a31d1a;
            --accent-glow: rgba(232, 51, 46, 0.35);
            --yellow: #ffd23f;
            --radius: 0px;
            --cut: 14px; /* coin coupé des panels */
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        *:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 3px;
        }

        html { scroll-behavior: smooth; }

        body {
            font-family: 'Inter Tight', 'Noto Sans JP', sans-serif;
            background: var(--bg);
            color: var(--ink);
            min-height: 100vh;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
            font-weight: 400;
            letter-spacing: 0.01em;
        }

        /* SCREENTONE — trame de points façon manga */
        body::after {
            content: '';
            position: fixed;
            inset: 0;
            background-image: radial-gradient(circle, rgba(242,239,233,0.05) 1px, transparent 1.2px);
            background-size: 7px 7px;
            pointer-events: none;
            z-index: 9999;
            mix-blend-mode: overlay;
        }

        /* Vignette + halo rouge */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background:
                radial-gradient(ellipse at center, transparent 35%, rgba(0,0,0,0.55) 100%),
                radial-gradient(circle at 12% 15%, rgba(232, 51, 46, 0.09), transparent 45%),
                radial-gradient(circle at 88% 85%, rgba(232, 51, 46, 0.05), transparent 45%);
            pointer-events: none;
            z-index: 1;
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }

        #confetti-canvas {
            position: fixed; inset: 0;
            pointer-events: none; z-index: 1000;
        }

        .container {
            position: relative;
            z-index: 2;
            max-width: 1320px;
            margin: 0 auto;
            padding: 48px 24px 100px;
        }

        /* Panel manga générique : coin coupé + bord encré */
        .manga-panel {
            clip-path: polygon(0 0, 100% 0, 100% calc(100% - var(--cut)), calc(100% - var(--cut)) 100%, 0 100%);
        }

        /* ============================================================
         * HEADER — Couverture de tome
         * ============================================================ */
        header {
            text-align: center;
            margin-bottom: 80px;
            padding: 60px 0 40px;
            position: relative;
            animation: fadeInDown 1s ease-out;
        }

        /* Burst de vitesse derrière le titre */
        header::before {
            content: '';
            position: absolute;
            top: 50%; left: 50%;
            width: min(120vw, 900px);
            aspect-ratio: 1;
            transform: translate(-50%, -55%);
            background: repeating-conic-gradient(
                from 0deg,
                rgba(242,239,233,0.05) 0deg 2deg,
                transparent 2deg 9deg
            );
            -webkit-mask-image: radial-gradient(circle, transparent 18%, black 40%, transparent 72%);
            mask-image: radial-gradient(circle, transparent 18%, black 40%, transparent 72%);
            pointer-events: none;
            z-index: -1;
        }

        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-12px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .header-tag {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.7rem;
            letter-spacing: 4px;
            color: var(--ink-mute);
            text-transform: uppercase;
            margin-bottom: 28px;
        }

        .header-tag::before, .header-tag::after {
            content: '';
            width: 32px;
            height: 2px;
            background: var(--accent);
            transform: skewX(-20deg);
        }

        .title {
            font-family: 'Anton', 'Noto Sans JP', sans-serif;
            font-size: clamp(2.8rem, 9vw, 6.4rem);
            font-weight: 400;
            color: var(--ink);
            letter-spacing: clamp(1px, 0.4vw, 4px);
            line-height: 0.95;
            margin-bottom: 20px;
            text-transform: uppercase;
            transform: skewX(-4deg);
            text-shadow:
                4px 4px 0 var(--accent),
                8px 8px 0 rgba(163, 29, 26, 0.4);
        }

        .title-jp {
            font-family: 'Noto Sans JP', sans-serif;
            font-weight: 900;
            font-size: clamp(0.85rem, 1.8vw, 1.2rem);
            letter-spacing: 10px;
            color: var(--accent);
            margin-bottom: 12px;
        }

        .subtitle {
            font-family: 'Inter Tight', sans-serif;
            font-style: italic;
            font-size: clamp(0.9rem, 1.5vw, 1.1rem);
            color: var(--ink-dim);
            font-weight: 500;
            letter-spacing: 2px;
            margin-top: 8px;
        }

        .header-meta {
            display: flex;
            justify-content: center;
            gap: 32px;
            margin-top: 40px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.7rem;
            color: var(--ink-mute);
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .header-meta span { display: inline-flex; align-items: center; gap: 8px; }
        .header-meta .dot {
            width: 7px; height: 7px;
            background: var(--accent);
            transform: rotate(45deg);
        }

        /* ============================================================
         * SECTIONS — En-têtes façon épisode
         * ============================================================ */
        .section-num {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.7rem;
            color: var(--accent);
            letter-spacing: 3px;
            display: block;
            padding: 3px 10px;
            border: 1px solid var(--accent);
            transform: skewX(-12deg);
        }

        .section-title {
            font-family: 'Anton', 'Noto Sans JP', sans-serif;
            font-weight: 400;
            font-size: clamp(1.5rem, 3vw, 2.1rem);
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--ink);
            display: flex;
            align-items: baseline;
            gap: 16px;
        }

        .section-jp {
            font-family: 'Noto Sans JP', sans-serif;
            font-weight: 700;
            font-size: 0.75rem;
            color: var(--ink-mute);
            letter-spacing: 4px;
        }

        .section-divider {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 32px;
            padding-bottom: 16px;
            border-bottom: 2px solid var(--line-strong);
        }

        .section-divider .line {
            flex: 1;
            height: 2px;
            background: repeating-linear-gradient(90deg, var(--line-strong) 0 12px, transparent 12px 20px);
        }

        .count-badge {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.7rem;
            color: var(--bg);
            font-weight: 700;
            letter-spacing: 2px;
            padding: 4px 12px;
            background: var(--yellow);
            transform: skewX(-12deg);
        }

        /* ============================================================
         * TODAY — Page de couverture
         * ============================================================ */
        .today-section {
            margin-bottom: 80px;
            animation: fadeInUp 1s 0.1s ease-out backwards;
        }

        .today-poster {
            display: grid;
            grid-template-columns: 280px 1fr;
            gap: 40px;
            background: var(--bg-elev);
            border: 2px solid var(--border-ink);
            padding: 40px;
            position: relative;
            overflow: hidden;
            clip-path: polygon(0 0, 100% 0, 100% calc(100% - 22px), calc(100% - 22px) 100%, 0 100%);
        }

        /* Burst de vitesse derrière l'avatar */
        .today-poster::before {
            content: '';
            position: absolute;
            top: 50%; left: 200px;
            width: 700px;
            aspect-ratio: 1;
            transform: translate(-50%, -50%);
            background: repeating-conic-gradient(
                from 0deg,
                rgba(232, 51, 46, 0.12) 0deg 3deg,
                transparent 3deg 11deg
            );
            -webkit-mask-image: radial-gradient(circle, black 0%, transparent 65%);
            mask-image: radial-gradient(circle, black 0%, transparent 65%);
            pointer-events: none;
        }

        .today-poster::after {
            content: '誕生日';
            position: absolute;
            font-family: 'Noto Sans JP', sans-serif;
            font-weight: 900;
            writing-mode: vertical-rl;
            font-size: clamp(4rem, 10vw, 8rem);
            top: 50%; right: 8px;
            transform: translateY(-50%);
            color: var(--ink);
            opacity: 0.05;
            letter-spacing: 12px;
            pointer-events: none;
        }

        .today-image-wrap {
            aspect-ratio: 2 / 3;
            overflow: hidden;
            position: relative;
            background: var(--bg-elev-2);
            border: 2px solid var(--border-ink);
            z-index: 1;
        }

        .today-image-wrap .avatar,
        .today-image-wrap .avatar-placeholder {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .today-image-wrap .avatar-placeholder {
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Anton', sans-serif;
            font-size: 6rem;
            color: var(--accent);
            background:
                radial-gradient(circle, rgba(242,239,233,0.06) 1px, transparent 1.2px) 0 0 / 8px 8px,
                linear-gradient(135deg, var(--bg-elev-2), var(--bg-elev));
        }

        .today-image-wrap::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(to top, rgba(0,0,0,0.6), transparent 50%);
            pointer-events: none;
        }

        .today-info { position: relative; z-index: 1; display: flex; flex-direction: column; justify-content: center; }

        .today-feature-tag {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.7rem;
            color: var(--accent);
            letter-spacing: 4px;
            text-transform: uppercase;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .today-feature-tag::before {
            content: '';
            width: 24px; height: 2px;
            background: var(--accent);
            transform: skewX(-20deg);
        }

        .today-name {
            font-family: 'Anton', 'Noto Sans JP', sans-serif;
            font-weight: 400;
            font-size: clamp(2rem, 4.5vw, 3.6rem);
            line-height: 1;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-bottom: 16px;
            transform: skewX(-3deg);
            text-shadow: 3px 3px 0 var(--accent);
        }

        .today-tagline {
            font-size: 1.1rem;
            color: var(--ink-dim);
            font-style: italic;
            margin-bottom: 24px;
        }

        .age-highlight {
            color: var(--yellow);
            font-weight: 700;
            font-style: normal;
        }

        .today-credits {
            display: grid;
            grid-template-columns: auto 1fr;
            gap: 8px 20px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.75rem;
            margin-bottom: 28px;
            padding: 20px 0;
            border-top: 2px solid var(--line-strong);
            border-bottom: 2px solid var(--line-strong);
        }

        .credit-label {
            color: var(--ink-mute);
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .credit-value { color: var(--ink); }

        .share-btn {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            padding: 14px 30px;
            background: var(--accent);
            color: var(--ink);
            border: none;
            font-family: 'Anton', sans-serif;
            font-weight: 400;
            font-size: 0.95rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            cursor: pointer;
            transition: background 0.3s, transform 0.2s, box-shadow 0.3s;
            align-self: flex-start;
            clip-path: polygon(8px 0, 100% 0, calc(100% - 8px) 100%, 0 100%);
        }

        .share-btn:hover {
            background: var(--accent-dark);
            box-shadow: 0 0 30px var(--accent-glow);
        }

        .share-btn:active { transform: translateY(1px); }

        /* ============================================================
         * TOOLBAR
         * ============================================================ */
        .toolbar {
            display: grid;
            grid-template-columns: 1fr auto auto;
            gap: 0;
            margin-bottom: 48px;
            border: 2px solid var(--line-strong);
            background: var(--bg-elev);
            animation: fadeInUp 1s 0.2s ease-out backwards;
            clip-path: polygon(0 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%);
        }

        .search-wrapper {
            position: relative;
            display: flex;
            align-items: center;
            border-right: 1px solid var(--line);
        }

        .search-icon {
            position: absolute;
            left: 18px;
            color: var(--ink-mute);
            font-size: 0.9rem;
            pointer-events: none;
        }

        .search-input {
            width: 100%;
            padding: 16px 44px 16px 44px;
            background: transparent;
            border: none;
            color: var(--ink);
            font-family: 'Inter Tight', sans-serif;
            font-size: 0.95rem;
            letter-spacing: 0.5px;
        }

        .search-input:focus { outline: none; }
        .search-input::placeholder { color: var(--ink-mute); font-style: italic; }

        .search-clear {
            position: absolute;
            right: 12px;
            background: var(--line);
            border: none;
            color: var(--ink-dim);
            width: 22px; height: 22px;
            cursor: pointer;
            display: none;
            align-items: center;
            justify-content: center;
            font-size: 0.7rem;
            transition: background 0.2s;
        }

        .search-clear.visible { display: flex; }
        .search-clear:hover { background: var(--accent); color: var(--ink); }

        .toolbar-select {
            padding: 16px 36px 16px 18px;
            background: transparent;
            border: none;
            border-left: 1px solid var(--line);
            color: var(--ink);
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.75rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            cursor: pointer;
            appearance: none;
            -webkit-appearance: none;
            background-image: url("data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22292.4%22%20height%3D%22292.4%22%3E%3Cpath%20fill%3D%22%23a5a29b%22%20d%3D%22M287%2069.4a17.6%2017.6%200%200%200-13-5.4H18.4c-5%200-9.3%201.8-12.9%205.4A17.6%2017.6%200%200%200%200%2082.2c0%205%201.8%209.3%205.4%2012.9l128%20127.9c3.6%203.6%207.8%205.4%2012.8%205.4s9.2-1.8%2012.8-5.4L287%2095c3.5-3.5%205.4-7.8%205.4-12.8%200-5-1.9-9.2-5.5-12.8z%22%2F%3E%3C%2Fsvg%3E");
            background-repeat: no-repeat;
            background-position: right 14px center;
            background-size: 8px;
            transition: background-color 0.2s, color 0.2s;
        }

        .toolbar-select:hover {
            background-color: rgba(232, 51, 46, 0.1);
            color: var(--accent);
        }

        .toolbar-select:focus {
            outline: none;
            background-color: rgba(232, 51, 46, 0.15);
        }

        .toolbar-select option { background: var(--bg-elev); color: var(--ink); }

        /* ============================================================
         * TOP 3 — Prochains épisodes
         * ============================================================ */
        .top3-section {
            margin-bottom: 80px;
            animation: fadeInUp 1s 0.3s ease-out backwards;
        }

        .top3-list {
            display: flex;
            gap: 24px;
            overflow-x: auto;
            padding: 8px 4px 24px;
            scrollbar-width: none;
            scroll-snap-type: x mandatory;
            -webkit-overflow-scrolling: touch;
        }
        .top3-list::-webkit-scrollbar { display: none; }

        .top3-tile {
            position: relative;
            flex-shrink: 0;
            width: 280px;
            scroll-snap-align: start;
            transition: transform 0.4s cubic-bezier(0.2, 0.6, 0.2, 1);
            color: inherit;
            display: block;
        }

        .top3-tile:hover { transform: translateY(-8px) rotate(-0.5deg); }

        .top3-rank-overlay {
            position: absolute;
            top: 10px;
            left: 12px;
            z-index: 5;
            font-family: 'Anton', sans-serif;
            font-size: 4.5rem;
            line-height: 0.9;
            color: var(--ink);
            text-shadow:
                3px 3px 0 var(--accent),
                6px 6px 12px rgba(0,0,0,0.8);
            transform: skewX(-6deg);
        }

        .top3-rank-overlay::before {
            content: 'NEXT';
            display: block;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.65rem;
            letter-spacing: 3px;
            color: var(--yellow);
            text-shadow: none;
            margin-bottom: -2px;
            transform: skewX(6deg);
        }

        .top3-image-container {
            position: relative;
            width: 100%;
            aspect-ratio: 2 / 3;
            overflow: hidden;
            background: var(--bg-elev);
            border: 2px solid var(--line-strong);
            transition: border-color 0.3s, box-shadow 0.3s;
            clip-path: polygon(0 0, 100% 0, 100% calc(100% - var(--cut)), calc(100% - var(--cut)) 100%, 0 100%);
        }

        .top3-tile:hover .top3-image-container {
            border-color: var(--border-ink);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6), 0 0 30px var(--accent-glow);
        }

        .top3-tile-image,
        .top3-tile-placeholder {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: transform 0.6s ease;
        }

        .top3-tile:hover .top3-tile-image {
            transform: scale(1.05);
        }

        .top3-tile-placeholder {
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Anton', sans-serif;
            font-size: 7rem;
            color: var(--accent);
            background:
                radial-gradient(circle, rgba(242,239,233,0.06) 1px, transparent 1.2px) 0 0 / 8px 8px,
                linear-gradient(135deg, var(--bg-elev-2), var(--bg-elev));
        }

        .top3-tile-overlays {
            position: absolute;
            bottom: 0; left: 0; right: 0;
            padding: 60px 18px 18px;
            background: linear-gradient(to top, rgba(10, 10, 12, 0.98), rgba(10, 10, 12, 0.85) 40%, transparent);
        }

        .top3-tile-name {
            font-family: 'Anton', 'Noto Sans JP', sans-serif;
            font-size: 1.1rem;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            margin-bottom: 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .top3-tile-date {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.7rem;
            color: var(--ink-dim);
            letter-spacing: 2px;
            margin-bottom: 12px;
            text-transform: uppercase;
        }

        .top3-countdown { display: flex; gap: 4px; }

        .top3-countdown-item {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--line);
            padding: 6px 0;
            text-align: center;
            flex: 1;
        }

        .top3-countdown-value {
            font-family: 'JetBrains Mono', monospace;
            font-weight: 700;
            font-size: 1rem;
            color: var(--ink);
        }

        .top3-countdown-label {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.5rem;
            color: var(--ink-mute);
            text-transform: uppercase;
            margin-top: 2px;
            letter-spacing: 1.5px;
        }

        .top3-age-corner {
            position: absolute;
            top: 12px;
            right: -6px;
            background: var(--yellow);
            color: var(--bg);
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.7rem;
            font-weight: 700;
            padding: 4px 14px;
            letter-spacing: 1px;
            z-index: 5;
            transform: skewX(-12deg);
        }

        /* ============================================================
         * MONTH GROUPS
         * ============================================================ */
        .month-section {
            margin-bottom: 56px;
            animation: fadeInUp 1s 0.4s ease-out backwards;
        }

        .month-header {
            display: flex;
            align-items: baseline;
            gap: 20px;
            margin-bottom: 28px;
            padding-bottom: 14px;
            border-bottom: 1px solid var(--line);
        }

        .month-name {
            font-family: 'Anton', 'Noto Sans JP', sans-serif;
            font-weight: 400;
            font-size: 1.5rem;
            letter-spacing: 3px;
            color: var(--ink);
            text-transform: uppercase;
        }

        .month-name.current { color: var(--accent); text-shadow: 2px 2px 0 rgba(232,51,46,0.25); }

        .month-num {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.7rem;
            color: var(--ink-mute);
            letter-spacing: 2px;
        }

        .month-count {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.7rem;
            color: var(--ink-dim);
            letter-spacing: 2px;
            margin-left: auto;
        }

        /* ============================================================
         * BIRTHDAY CARDS — Cases de manga
         * ============================================================ */
        .birthday-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 16px;
        }

        .birthday-card {
            position: relative;
            display: flex;
            gap: 16px;
            padding: 16px;
            background: var(--bg-elev);
            border: 1px solid var(--line-strong);
            transition: border-color 0.3s, transform 0.3s, box-shadow 0.3s;

/*__ZAP_CSS__*/

        /* ============================================================
         * FOUDRE — carte « À l'honneur » uniquement.
         * Purement additif : la bordure, le fond et la mise en page
         * du poster ne sont pas touchés. Deux calques en overlay.
         * ============================================================ */
        .zap-hero {
            /* Teintes du plasma. Pour rester dans le thème manga :
               --volt: #ffd23f; --volt-hot: #fff3c4; --volt-deep: #e8332e; */
            --volt: #8fc2ff;
            --volt-hot: #d8ecff;
            --volt-deep: #2f6dff;
        }

        .zap-hero .zap-svg {
            position: absolute;
            top: -10%;
            left: 0;
            width: 100%;
            height: 120%;
            pointer-events: none;
            overflow: visible;
            z-index: 4;
        }

        /* Lueur des bords, synchronisée avec les décharges.
           En « inset » car le clip-path du poster découperait
           une ombre extérieure classique. */
        .zap-hero .zap-glow {
            position: absolute;
            inset: 0;
            pointer-events: none;
            opacity: 0;
            z-index: 2;
            box-shadow:
                inset 0 0 26px 2px var(--volt),
                inset 0 0 60px 6px var(--volt-deep);
            transition: opacity 45ms linear;
        }

        .zap-hero .zap-flash {
            position: absolute;
            inset: 0;
            background:
                linear-gradient(180deg, rgba(143, 194, 255, 0.32), rgba(143, 194, 255, 0.03) 60%, transparent),
                radial-gradient(ellipse at 50% -10%, rgba(255, 255, 255, 0.4), transparent 65%);
            mix-blend-mode: screen;
            pointer-events: none;
            opacity: 0;
            z-index: 3;
            transition: opacity 40ms linear;
        }

        @media (prefers-reduced-motion: reduce) {
            .zap-hero .zap-svg,
            .zap-hero .zap-glow,
            .zap-hero .zap-flash { display: none !important; }
        }

        /* ============================================================
         * MOBILE
         * ============================================================ */
        @media (max-width: 900px) {
            .today-poster {
                grid-template-columns: 1fr;

        @media (max-width: 600px) {
            .container { padding: 32px 16px 80px; }
            .header-meta { flex-direction: column; gap: 8px; }
            .stats-grid { grid-template-columns: 1fr; }
            .top3-tile { width: 240px; }
            .today-poster::after { display: none; }
        }
    </style>
</head>

    <script>
        'use strict';

        /* ============================================================
         * DONNÉES
         * ============================================================ */
        const today = new Date();
        const monthNames = ['janvier', 'février', 'mars', 'avril', 'mai', 'juin',
            'juillet', 'août', 'septembre', 'octobre', 'novembre', 'décembre'];
        const monthNamesShort = ['JANVIER', 'FÉVRIER', 'MARS', 'AVRIL', 'MAI', 'JUIN',
            'JUILLET', 'AOÛT', 'SEPTEMBRE', 'OCTOBRE', 'NOVEMBRE', 'DÉCEMBRE'];

        /* Images de repli, utilisées quand il n'y a pas d'ID Discord
           (ou que la personne n'est pas sur le serveur Lanyard). */
        const avatarsParGenre = {
            homme: 'homme.jpg',
            femme: 'femme.jpg'
        };

        /* ★ SOURCE UNIQUE : la liste vit dans birthdays.json (à la racine du repo).
           Le site ET le bot Discord lisent le même fichier.
           Pour ajouter quelqu'un → éditer birthdays.json, rien d'autre. */
        let users = [];

        /* ============================================================
         * ⚡ MOTEUR DE FOUDRE — piloté en JS, jamais deux fois pareil
         *
         * Contrairement à une animation CSS qui boucle, chaque décharge
         * régénère sa géométrie, son intensité, son nombre d'arcs de
         * retour et son délai d'attente. Rien ne se répète.
         * ============================================================ */

        (function (global) {
            'use strict';

            const SVG_NS = 'http://www.w3.org/2000/svg';
            const rand = (a, b) => a + Math.random() * (b - a);
            const randInt = (a, b) => Math.floor(rand(a, b + 1));
            const pick = arr => arr[Math.floor(Math.random() * arr.length)];

            /* --- Géométrie fractale (déplacement de point médian) --- */
            function fractal(x1, y1, x2, y2, cfg) {
                let segs = [[{ x: x1, y: y1 }, { x: x2, y: y2 }]];
                const branches = [];
                let off = cfg.offset;

                for (let lvl = 0; lvl < cfg.detail; lvl++) {
                    const next = [];
                    for (const [a, b] of segs) {
                        const dx = b.x - a.x, dy = b.y - a.y;
                        const len = Math.hypot(dx, dy) || 1;
                        const px = -dy / len, py = dx / len;
                        const d = rand(-off, off);
                        const mid = { x: (a.x + b.x) / 2 + px * d, y: (a.y + b.y) / 2 + py * d };
                        next.push([a, mid], [mid, b]);

                        if (lvl > 1 && lvl < cfg.detail - 1 && Math.random() < cfg.branch) {
                            const ang = Math.atan2(b.y - mid.y, b.x - mid.x)
                                      + (Math.random() < 0.5 ? -1 : 1) * rand(0.3, 0.95);
                            const bl = len * rand(0.35, 1.3);
                            branches.push(fractal(mid.x, mid.y,
                                mid.x + Math.cos(ang) * bl, mid.y + Math.sin(ang) * bl,
                                { detail: randInt(2, 4), offset: off * 0.7, branch: 0.12 }).main);
                        }
                    }
                    segs = next;
                    off *= cfg.decay;
                }
                return { main: [segs[0][0], ...segs.map(s => s[1])], branches };
            }

            const toD = pts => 'M' + pts.map(p => `${p.x.toFixed(1)} ${p.y.toFixed(1)}`).join(' L');

            /* --- Un canal de foudre : plusieurs couches sur le même tracé --- */
            class Channel {
                constructor(svg, paths, scale) {
                    this.g = document.createElementNS(SVG_NS, 'g');
                    this.layers = [];

                    const specs = [
                        { stroke: 'var(--volt-deep)', w: 24 * scale, blur: 11,  op: 0.26 },
                        { stroke: 'var(--volt)',      w: 9 * scale,  blur: 3.5, op: 0.68 },
                        { stroke: 'var(--volt-hot)',  w: 4 * scale,  blur: 1.2, op: 0.9 },
                        { stroke: '#ffffff',          w: 2 * scale,  blur: 0,   op: 1 },
                    ];

                    for (const s of specs) {

        async function fetchDiscordAvatar(id) {

            if (!res.ok) throw new Error('lanyard');
            const json = await res.json();
            const du = json && json.data && json.data.discord_user;
            if (!du || !du.avatar) throw new Error('no avatar');
            const ext = du.avatar.startsWith('a_') ? 'gif' : 'png';
            return `https://cdn.discordapp.com/avatars/${id}/${du.avatar}.${ext}?size=256`;
        }

        async function syncDiscordAvatars() {
            const withId = users.filter(u => u.discordId);
            if (withId.length === 0) return;

            const cached = readDiscordCache();
            if (cached) {
                let hit = false;
                withId.forEach(u => {
                    if (cached[u.discordId]) { u.avatar = cached[u.discordId]; hit = true; }
                });
                if (hit) refreshAvatars();
                return;
            }

            const map = {};
            await Promise.all(withId.map(async u => {
                try {
                    const url = await fetchDiscordAvatar(u.discordId);
                    u.avatar = url;
                    map[u.discordId] = url;
                } catch (e) { /* pas sur Lanyard → on garde l'image homme/femme */ }
            }));

            if (Object.keys(map).length > 0) {
                writeDiscordCache(map);
                refreshAvatars();
            }

        function getNextBirthday(birthday) {
            const now = new Date();
            const thisYear = now.getFullYear();
            const todayMidnight = new Date(thisYear, now.getMonth(), now.getDate());
            let next = new Date(thisYear, birthday.month - 1, birthday.day);
            if (next < todayMidnight) next = new Date(thisYear + 1, birthday.month - 1, birthday.day);
            return next;
        }

            if (birthday.year == null) return null; // année non renseignée
            const now = new Date();
            let age = now.getFullYear() - birthday.year;
            const m = now.getMonth() + 1;
            const d = now.getDate();
            if (m < birthday.month || (m === birthday.month && d < birthday.day)) age--;

            if (birthday.year == null) return null;
            const birthDate = new Date(birthday.year, birthday.month - 1, birthday.day);
            const now = new Date();
            const diffMs = now - birthDate;
            const totalMinutes = Math.floor(diffMs / 60000);
            const totalHours = Math.floor(diffMs / 3600000);
            const totalDays = Math.floor(diffMs / 86400000);
            const totalWeeks = Math.floor(totalDays / 7);

            const heartbeatsMin = Math.floor(totalMinutes * 60);

            return {
                hours: totalHours,
                days: totalDays,
                weeks: totalWeeks,
                heartbeatsMin,
                heartbeatsMax

                    height: Math.random() * 8 + 4,
                    color: this.colors[Math.floor(Math.random() * this.colors.length)],
                    shape: ['square', 'circle', 'ribbon'][Math.floor(Math.random() * 3)],
                    rotation: Math.random() * 360,
                    rotationSpeed: (Math.random() - 0.5) * 6,
                    velocityX: (Math.random() - 0.5) * 1,
                    velocityY: Math.random() * 0.4 + 0.15,
                    gravity: 0.015, drag: 0.998, opacity: 1,
                    wobble: Math.random() * 10,
                    wobbleSpeed: Math.random() * 0.04 + 0.01,
                    tilt: Math.random() * Math.PI
                };
            }
            drawSpeedLines(ctx, cx, cy, radius) {
                ctx.save();
                ctx.translate(cx, cy);
                ctx.strokeStyle = 'rgba(232, 51, 46, 0.18)';
                ctx.lineWidth = 2;
                for (let a = 0; a < 360; a += 9) {
                    const rad = a * Math.PI / 180;
                    ctx.beginPath();
                    ctx.moveTo(Math.cos(rad) * radius * 0.35, Math.sin(rad) * radius * 0.35);
                    ctx.lineTo(Math.cos(rad) * radius, Math.sin(rad) * radius);
                    ctx.stroke();
                }
                ctx.restore();
            }
            drawCard() {
                const ctx = this.ctx;
                ctx.clearRect(0, 0, this.width, this.height);
                ctx.fillStyle = '#0a0a0c';
                ctx.fillRect(0, 0, this.width, this.height);

                // Image
                const imageHeight = 290;
                if (this.image && this.imageLoaded) {
                    const imgRatio = this.image.width / this.image.height;
                    const cardRatio = this.width / imageHeight;
                    let dW, dH, dX, dY;
                    if (imgRatio > cardRatio) { dH = imageHeight; dW = this.image.width * (imageHeight / this.image.height); dX = (this.width - dW) / 2; dY = 0; }
                    else { dW = this.width; dH = this.image.height * (this.width / this.image.width); dX = 0; dY = 0; }
                    ctx.drawImage(this.image, dX, dY, dW, dH);
                    // Vignette
                    const grd = ctx.createLinearGradient(0, imageHeight - 80, 0, imageHeight);
                    grd.addColorStop(0, 'rgba(10,10,12,0)');
                    grd.addColorStop(1, 'rgba(10,10,12,0.85)');
                    ctx.fillStyle = grd;
                    ctx.fillRect(0, imageHeight - 80, this.width, 80);
                } else {
                    ctx.fillStyle = '#131318';
                    ctx.fillRect(0, 0, this.width, imageHeight);
                    this.drawSpeedLines(ctx, this.width / 2, imageHeight / 2, 200);
                    ctx.fillStyle = '#e8332e';
                    ctx.font = '120px Anton, sans-serif';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText(this.userInitial, this.width / 2, imageHeight / 2);
                }

                this.particles.forEach(p => this.drawParticle(p));

                // Info zone
                const infoY = imageHeight;
                ctx.fillStyle = '#131318';
                ctx.fillRect(0, infoY, this.width, this.height - infoY);

                // Barre diagonale rouge
                ctx.save();
                ctx.fillStyle = '#e8332e';
                ctx.transform(1, 0, -0.3, 1, 0, 0);
                ctx.fillRect(28, infoY + 16, 34, 3);
                ctx.restore();

                // Tagline
                ctx.fillStyle = '#e8332e';
                ctx.font = '10px JetBrains Mono, monospace';
                ctx.textAlign = 'left';
                ctx.textBaseline = 'alphabetic';
                ctx.fillText('— 誕生日スペシャル —', 60, infoY + 22);

                // Name
                ctx.fillStyle = '#f2efe9';
                let fontSize = 24;
                ctx.font = `${fontSize}px Anton, sans-serif`;
                while (ctx.measureText(this.userName.toUpperCase()).width > this.width - 40 && fontSize > 12) {
                    fontSize -= 1;
                    ctx.font = `${fontSize}px Anton, sans-serif`;
                }
                ctx.fillText(this.userName.toUpperCase(), 20, infoY + 56);

                // Age badge (haut droite, jaune, skewé)
                const badgeText = this.userAge !== null ? `${this.userAge} ANS` : '🎂 !!';
                ctx.font = 'bold 11px JetBrains Mono, monospace';
                const badgeW = ctx.measureText(badgeText).width + 18;
                ctx.save();
                ctx.transform(1, 0, -0.2, 1, 0, 0);
                ctx.fillStyle = '#ffd23f';
                ctx.fillRect(this.width - badgeW - 8, 12, badgeW, 22);
                ctx.fillStyle = '#0a0a0c';
                ctx.textAlign = 'center';
                ctx.fillText(badgeText, this.width - badgeW/2 - 8, 27);
                ctx.restore();

                // Date
                ctx.textAlign = 'left';
                const dateStr = `${today.getDate().toString().padStart(2,'0')} · ${monthNamesShort[today.getMonth()]} · ${today.getFullYear()}`;
                ctx.fillStyle = '#a5a29b';
                ctx.font = '10px JetBrains Mono, monospace';
                ctx.fillText(dateStr, 20, infoY + 80);

                // Tagline italic
                ctx.fillStyle = '#a5a29b';
                ctx.font = 'italic 11px Inter Tight, sans-serif';
                ctx.fillText(`Joyeux anniversaire !!`, 20, infoY + 100);

                // Border
                ctx.strokeStyle = 'rgba(242, 239, 233, 0.85)';
                ctx.lineWidth = 2;
                ctx.strokeRect(1, 1, this.width - 2, this.height - 2);
            }
            drawParticle(p) {
                const ctx = this.ctx;
                ctx.save();
                ctx.translate(p.x, p.y);
                ctx.rotate(p.rotation * Math.PI / 180);
                ctx.scale(1, Math.cos(p.tilt));
                ctx.globalAlpha = p.opacity;
                ctx.fillStyle = p.color;
                if (p.shape === 'square') ctx.fillRect(-p.width/2, -p.height/2, p.width, p.height);
                else if (p.shape === 'circle') { ctx.beginPath(); ctx.arc(0, 0, p.width/2, 0, Math.PI*2); ctx.fill(); }
                else { ctx.beginPath(); ctx.moveTo(-p.width/2, -p.height/2); ctx.lineTo(p.width/2, -p.height/4); ctx.lineTo(p.width/2, p.height/2); ctx.lineTo(-p.width/2, p.height/4); ctx.closePath(); ctx.fill(); }
                ctx.restore();
            }
            updateParticle(p) {
                p.velocityY += p.gravity;
                p.velocityX *= p.drag;
                p.velocityY *= p.drag;
                p.x += p.velocityX + Math.sin(p.wobble) * 0.6;
                p.y += p.velocityY;
                p.rotation += p.rotationSpeed;
                p.wobble += p.wobbleSpeed;
                p.tilt += 0.01;
                if (p.y > this.height - 80) p.opacity -= 0.02;
                return p.y < this.height + 20 && p.opacity > 0;
            }
            animate() {
                if (!this.running) return;
                if (this.particles.length < 50 && Math.random() > 0.75) this.particles.push(this.createParticle(true));
                this.particles = this.particles.filter(p => this.updateParticle(p));
                this.drawCard();
                cardAnimationId = requestAnimationFrame(() => this.animate());
            }
            start() {
                this.running = true;
                for (let i = 0; i < 20; i++) this.particles.push(this.createParticle(false));
                this.animate();
            }
            stop() { this.running = false; if (cardAnimationId) cancelAnimationFrame(cardAnimationId); }
            clear() { this.particles = []; this.ctx.clearRect(0, 0, this.width, this.height); }
        }

        async function downloadGif() {
            const generatingText = document.getElementById('generating-text');
            generatingText.classList.add('active');
            showToast('Capture en cours');
            try {
                await new Promise(r => setTimeout(r, 2000));
                const frames = [];
                for (let i = 0; i < 90; i++) {
                    await new Promise(r => setTimeout(r, 44));
                    const fc = document.createElement('canvas');
                    fc.width = cardConfetti.width;
                    fc.height = cardConfetti.height;
                    fc.getContext('2d').drawImage(cardConfetti.canvas, 0, 0);
                    frames.push(fc);
                }
                showToast('Création du GIF');
                const workerCode = await fetch('https://cdnjs.cloudflare.com/ajax/libs/gif.js/0.2.0/gif.worker.js').then(r => r.text());
                const workerBlob = new Blob([workerCode], { type: 'application/javascript' });
                const workerUrl = URL.createObjectURL(workerBlob);
                const gif = new GIF({ workers: 4, quality: 1, width: cardConfetti.width, height: cardConfetti.height, workerScript: workerUrl });
                frames.forEach(f => gif.addFrame(f, { delay: 44, copy: true }));
                gif.on('finished', function(blob) {
                    URL.revokeObjectURL(workerUrl);
                    const url = URL.createObjectURL(blob);
                    const link = document.createElement('a');
                    link.download = `anniversaire-${getShortName(currentShareUser).replace(/\s+/g, '-')}.gif`;
                    link.href = url;
                    link.click();
                    setTimeout(() => URL.revokeObjectURL(url), 100);
                    generatingText.classList.remove('active');
                    showToast('GIF téléchargé');
                });
                gif.on('error', function() { URL.revokeObjectURL(workerUrl); fallbackToPng(); });
                gif.render();
            } catch (e) { fallbackToPng(); }
        }

        /* ============================================================

        const visibleCountdowns = new Set();
        let countdownObserver = null;

        function initCountdownObserver() {
            if (countdownObserver) countdownObserver.disconnect();
            visibleCountdowns.clear();
            countdownObserver = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) visibleCountdowns.add(entry.target);
                    else visibleCountdowns.delete(entry.target);
                });
            }, { rootMargin: '100px' });
            document.querySelectorAll('[data-countdown]').forEach(el => countdownObserver.observe(el));
        }

        function updateVisibleCountdowns() {
            visibleCountdowns.forEach(el => {
                const target = new Date(el.dataset.countdown);
                const cd = getCountdown(target);
                const d = el.querySelector('.cd-d');
                const h = el.querySelector('.cd-h');
                const m = el.querySelector('.cd-m');
                const s = el.querySelector('.cd-s');
                if (d) d.textContent = cd.days;
                if (h) h.textContent = pad(cd.hours);
                if (m) m.textContent = pad(cd.minutes);
                if (s) s.textContent = pad(cd.seconds);
            });
        }

                    if (ageA === null && ageB === null) return 0;
                    if (ageA === null) return 1;  // inconnus toujours à la fin
                    if (ageB === null) return -1;
                    return sortBy === 'age-desc' ? ageB - ageA : ageA - ageB;
                });
            } else {
                filtered.sort((a, b) => getNextBirthday(a.birthday) - getNextBirthday(b.birthday));
            }

            const groupByMonth = sortBy === 'upcoming' && !search && monthFilter === 'all';

            if (groupByMonth) {
                const groups = new Map();
                filtered.forEach(u => {
                    const m = u.birthday.month - 1;
                    if (!groups.has(m)) groups.set(m, []);
                    groups.get(m).push(u);
                });

                let html = '';
                let cardIndex = 0;
                const currentMonth = today.getMonth();
                groups.forEach((monthUsers, monthIdx) => {
                    const isCurrent = monthIdx === currentMonth;
                    html += `
                        <div class="month-section">
                            <div class="month-header">
                                <span class="month-num">VOL. ${pad(monthIdx + 1)}</span>
                                <h3 class="month-name${isCurrent ? ' current' : ''}">${monthNames[monthIdx]}</h3>
                                <span class="month-count">${monthUsers.length} ${monthUsers.length > 1 ? 'personnages' : 'personnage'}</span>
                            </div>
                            <div class="birthday-grid">
                                ${monthUsers.map(u => createBirthdayCard(u, cardIndex++)).join('')}
                            </div>
                        </div>
                    `;
                });
                container.innerHTML = html;
            } else {
                container.innerHTML = `<div class="birthday-grid">${filtered.map((u, i) => createBirthdayCard(u, i)).join('')}</div>`;
            }

            initCountdownObserver();
        }

        /* ============================================================
         * SCROLL TO TOP
         * ============================================================ */
        const scrollTopBtn = document.getElementById('scroll-top');
        let scrollTicking = false;
        window.addEventListener('scroll', () => {
            if (!scrollTicking) {
                requestAnimationFrame(() => {
                    scrollTopBtn.classList.toggle('visible', window.scrollY > 400);
                    scrollTicking = false;
                });
                scrollTicking = true;
            }
        }, { passive: true });
        scrollTopBtn.addEventListener('click', () => window.scrollTo({ top: 0, behavior: 'smooth' }));

        /* ============================================================
         * TOOLBAR EVENTS
         * ============================================================ */
        const searchInput = document.getElementById('search-input');
        const searchClear = document.getElementById('search-clear');
        const filterMonth = document.getElementById('filter-month');
        const sortBy = document.getElementById('sort-by');

        const debouncedRender = debounce(renderBirthdays, 200);

        searchInput.addEventListener('input', () => {
            searchClear.classList.toggle('visible', searchInput.value.length > 0);
            debouncedRender();
        });

        searchClear.addEventListener('click', () => {
            searchInput.value = '';
            searchClear.classList.remove('visible');
            renderBirthdays();
            searchInput.focus();
        });

        filterMonth.addEventListener('change', renderBirthdays);
        sortBy.addEventListener('change', renderBirthdays);

        /* ============================================================
         * INIT — charge birthdays.json puis affiche tout
         * ============================================================ */
        async function init() {
            setHeaderMeta();
            setInterval(setHeaderMeta, 10000);

            try {
                const res = await fetch('birthdays.json', { cache: 'no-cache' });
                if (!res.ok) throw new Error('HTTP ' + res.status);
                users = await res.json();
            } catch (e) {
                console.error('Impossible de charger birthdays.json :', e);
                document.getElementById('birthdays-container').innerHTML = `
                    <div class="no-results">
                        <div class="no-results-mark">∅</div>
                        <p>Impossible de charger birthdays.json.<br>
                        Vérifie que le fichier est à la racine du site.<br>
                        (Note : en local, ouvre le site via un petit serveur,<br>
                        pas en double-cliquant sur le fichier.)</p>
                    </div>
                `;
                return;
            }

            // Avatars de repli homme/femme
            users.forEach(u => {
                u.avatarFallback = avatarsParGenre[u.genre] || null;
                u.avatar = u.avatarFallback;
            });

            setHeaderMeta();
            renderToday();
            renderTop3();
            renderBirthdays();
            renderStats();
            syncDiscordAvatars();
        }

        init();
        setInterval(updateVisibleCountdowns, 1000);

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js').catch(() => {});
            });
        }
    </script>
</body>
</html>
