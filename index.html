<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ANNIVERSAIRES — 誕生日スペシャル</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0a0a0c">
    <meta name="description" content="Suivez les anniversaires de l'équipe — édition manga.">
    <link rel="apple-touch-icon" href="icons/icon-192.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Noto+Sans+JP:wght@500;700;900&family=Inter+Tight:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            /* Palette manga — encre profonde + rouge shōnen */
            --bg: #0a0a0c;
            --bg-elev: #131318;
            --bg-elev-2: #1b1b22;
            --ink: #f2efe9;
            --ink-dim: #a5a29b;
            --ink-mute: #5b5952;
            --line: rgba(242, 239, 233, 0.1);
            --line-strong: rgba(242, 239, 233, 0.25);
            --border-ink: rgba(242, 239, 233, 0.85);
            --accent: #e8332e;
            --accent-dark: #a31d1a;
            --accent-glow: rgba(232, 51, 46, 0.35);
            --yellow: #ffd23f;
            --cord: #efe7d7;      /* la cordelette tressée, ivoire */
            --cord-deep: #b9ad95;  /* son ombre dans les tressages */
            --brocart: #ffd23f;   /* le fil d'or du brocart */
            --wood: #221913;      /* cèdre teinté des ema */
            --radius: 0px;
            --cut: 14px; /* coin coupé des panels */
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        *:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 3px;
        }
        html { scroll-behavior: smooth; }
        body {
            font-family: 'Inter Tight', 'Noto Sans JP', sans-serif;
            background: var(--bg);
            color: var(--ink);
            min-height: 100vh;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
            font-weight: 400;
            letter-spacing: 0.01em;
        }
        /* SCREENTONE — trame de points façon manga */
        body::after {
            content: '';
            position: fixed;
            inset: 0;
            background-image: radial-gradient(circle, rgba(242,239,233,0.05) 1px, transparent 1.2px);
            background-size: 7px 7px;
            pointer-events: none;
            z-index: 9999;
            mix-blend-mode: overlay;
        }
        /* Vignette seule — les halos rouges vivent maintenant dans #bg-fx */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background: radial-gradient(ellipse at center, transparent 32%, rgba(0,0,0,0.62) 100%);
            pointer-events: none;
            z-index: 1;
        }
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }
        #confetti-canvas {
            position: fixed; inset: 0;
            pointer-events: none; z-index: 1000;
        }
        .container {
            position: relative;
            z-index: 2;
            max-width: 1320px;
            margin: 0 auto;
            padding: 48px 24px 100px;
        }
        /* Panel manga générique : coin coupé + bord encré */
        .manga-panel {
            clip-path: polygon(0 0, 100% 0, 100% calc(100% - var(--cut)), calc(100% - var(--cut)) 100%, 0 100%);
        }
        /* ============================================================
         * HEADER — Couverture de tome
         * ============================================================ */
        header {
            text-align: center;
            margin-bottom: 80px;
            padding: 60px 0 40px;
            position: relative;
            animation: fadeInDown 1s ease-out;
        }
        /* Burst de vitesse derrière le titre */
        header::before {
            content: '';
            position: absolute;
            top: 50%; left: 50%;
            width: min(120vw, 900px);
            aspect-ratio: 1;
            transform: translate(-50%, -55%);
            background: repeating-conic-gradient(
                from 0deg,
                rgba(242,239,233,0.05) 0deg 2deg,
                transparent 2deg 9deg
            );
            -webkit-mask-image: radial-gradient(circle, transparent 18%, black 40%, transparent 72%);
            mask-image: radial-gradient(circle, transparent 18%, black 40%, transparent 72%);
            pointer-events: none;
            z-index: -1;
        }
        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-12px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .header-tag {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.7rem;
            letter-spacing: 4px;
            color: var(--ink-mute);
            text-transform: uppercase;
            margin-bottom: 28px;
        }
        .header-tag::before, .header-tag::after {
            content: '';
            width: 32px;
            height: 2px;
            background: var(--accent);
            transform: skewX(-20deg);
        }
        .title {
            font-family: 'Anton', 'Noto Sans JP', sans-serif;
            font-size: clamp(2.8rem, 9vw, 6.4rem);
            font-weight: 400;
            color: var(--ink);
            letter-spacing: clamp(1px, 0.4vw, 4px);
            line-height: 0.95;
            margin-bottom: 20px;
            text-transform: uppercase;
            transform: skewX(-4deg);
            text-shadow:
                4px 4px 0 var(--accent),
                8px 8px 0 rgba(163, 29, 26, 0.4);
        }
        .title-jp {
            font-family: 'Noto Sans JP', sans-serif;
            font-weight: 900;
            font-size: clamp(0.85rem, 1.8vw, 1.2rem);
            letter-spacing: 10px;
            color: var(--accent);
            margin-bottom: 12px;
        }
        .subtitle {
            font-family: 'Inter Tight', sans-serif;
            font-style: italic;
            font-size: clamp(0.9rem, 1.5vw, 1.1rem);
            color: var(--ink-dim);
            font-weight: 500;
            letter-spacing: 2px;
            margin-top: 8px;
        }
        .header-meta {
            display: flex;
            justify-content: center;
            gap: 32px;
            margin-top: 40px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.7rem;
            color: var(--ink-mute);
            letter-spacing: 2px;
            text-transform: uppercase;
        }
        .header-meta span { display: inline-flex; align-items: center; gap: 8px; }
        .header-meta .dot {
            width: 7px; height: 7px;
            background: var(--accent);
            transform: rotate(45deg);
        }
        /* ============================================================
         * SECTIONS — En-têtes façon épisode
         * ============================================================ */
        .section-num {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.7rem;
            color: var(--accent);
            letter-spacing: 3px;
            display: block;
            padding: 3px 10px;
            border: 1px solid var(--accent);
            transform: skewX(-12deg);
        }
        .section-title {
            font-family: 'Anton', 'Noto Sans JP', sans-serif;
            font-weight: 400;
            font-size: clamp(1.5rem, 3vw, 2.1rem);
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--ink);
            display: flex;
            align-items: baseline;
            gap: 16px;
        }
        .section-jp {
            font-family: 'Noto Sans JP', sans-serif;
            font-weight: 700;
            font-size: 0.75rem;
            color: var(--ink-mute);
            letter-spacing: 4px;
        }
        .section-divider {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 32px;
            padding-bottom: 16px;
            border-bottom: 2px solid var(--line-strong);
        }
        .section-divider .line {
            flex: 1;
            height: 2px;
            background: repeating-linear-gradient(90deg, var(--line-strong) 0 12px, transparent 12px 20px);
        }
        .count-badge {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.7rem;
            color: var(--bg);
            font-weight: 700;
            letter-spacing: 2px;
            padding: 4px 12px;
            background: var(--yellow);
            transform: skewX(-12deg);
        }
        /* ============================================================
         * TODAY — Page de couverture
         * ============================================================ */
        .today-section {
            margin-bottom: 80px;
            animation: fadeInUp 1s 0.1s ease-out backwards;
        }
        /* ---- ⛩ L'AFFICHE DU JOUR = un grand ema ----
           Un clip-path mange les bordures : impossible d'avoir un
           liseré propre le long des pentes du fronton. D'où deux
           calques imbriqués, découpés à la même forme — celui du
           dessous est la bordure, celui du dessus le contenu. */
        .today-hang { position: relative; padding-top: 44px; }
        .hero-cord {
            position: absolute;
            z-index: 4;
            top: -6px; left: 50%;
            width: 132px;
            transform: translateX(-50%);
        }
        .hero-cord .knot { width: 100%; }
        .today-frame {
            --gable: 46px;
            padding: 2px;
            background: linear-gradient(158deg,
                rgba(255, 210, 63, 0.6), rgba(242, 239, 233, 0.22) 45%, rgba(232, 51, 46, 0.4));
            clip-path: polygon(50% 0, 100% var(--gable), 100% calc(100% - 22px),
                               calc(100% - 22px) 100%, 0 100%, 0 var(--gable));
        }
        .today-poster {
            display: grid;
            grid-template-columns: 280px 1fr;
            gap: 40px;
            /* cèdre du sanctuaire : deux veines sur un fond chaud */
            background:
                repeating-linear-gradient(91deg, rgba(255,238,214,0.022) 0 1px, transparent 1px 7px),
                repeating-linear-gradient(89deg, rgba(0,0,0,0.14) 0 2px, transparent 2px 13px),
                linear-gradient(168deg, #2e231b 0%, #1a1310 60%, #241a14 100%);
            padding: 70px 38px 38px;
            position: relative;
            overflow: hidden;
            clip-path: polygon(50% 0, 100% 44px, 100% calc(100% - 21px),
                               calc(100% - 21px) 100%, 0 100%, 0 44px);
        }
        .today-frame { position: relative; }
        .today-frame::before {              /* les deux trous percés au faîte */
            content: '';
            position: absolute;
            z-index: 3;
            top: 30px; left: 50%;
            width: 60px; height: 7px;
            transform: translateX(-50%);
            background:
                radial-gradient(circle at 5px 50%,  rgba(0,0,0,0.9) 0 3px, transparent 3.2px),
                radial-gradient(circle at 55px 50%, rgba(0,0,0,0.9) 0 3px, transparent 3.2px);
        }
        /* Burst de vitesse derrière l'avatar */
        .today-poster::before {
            content: '';
            position: absolute;
            top: 54%; left: 200px;
            width: 700px;
            aspect-ratio: 1;
            transform: translate(-50%, -50%);
            background: repeating-conic-gradient(
                from 0deg,
                rgba(232, 51, 46, 0.12) 0deg 3deg,
                transparent 3deg 11deg
            );
            -webkit-mask-image: radial-gradient(circle, black 0%, transparent 65%);
            mask-image: radial-gradient(circle, black 0%, transparent 65%);
            pointer-events: none;
        }
        .today-poster::after {
            content: '誕生日';
            position: absolute;
            font-family: 'Noto Sans JP', sans-serif;
            font-weight: 900;
            writing-mode: vertical-rl;
            font-size: clamp(4rem, 10vw, 8rem);
            top: 50%; right: 8px;
            transform: translateY(-50%);
            color: var(--ink);
            opacity: 0.05;
            letter-spacing: 12px;
            pointer-events: none;
        }
        .today-image-wrap {
            aspect-ratio: 2 / 3;
            overflow: hidden;
            position: relative;
            background: var(--bg-elev-2);
            border: 1px solid rgba(255, 210, 63, 0.4);
            box-shadow: 0 0 0 3px rgba(0, 0, 0, 0.45);
            z-index: 1;
        }
        .today-image-wrap .avatar,
        .today-image-wrap .avatar-placeholder {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .today-image-wrap .avatar-placeholder {
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Anton', sans-serif;
            font-size: 6rem;
            color: var(--accent);
            background:
                radial-gradient(circle, rgba(242,239,233,0.06) 1px, transparent 1.2px) 0 0 / 8px 8px,
                linear-gradient(135deg, var(--bg-elev-2), var(--bg-elev));
        }
        .today-image-wrap::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(to top, rgba(0,0,0,0.6), transparent 50%);
            pointer-events: none;
        }
        .today-info { position: relative; z-index: 1; display: flex; flex-direction: column; justify-content: center; }
        .today-feature-tag {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.7rem;
            color: var(--accent);
            letter-spacing: 4px;
            text-transform: uppercase;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .today-feature-tag::before {
            content: '';
            width: 24px; height: 2px;
            background: var(--accent);
            transform: skewX(-20deg);
        }
        .today-name {
            font-family: 'Anton', 'Noto Sans JP', sans-serif;
            font-weight: 400;
            font-size: clamp(2rem, 4.5vw, 3.6rem);
            line-height: 1;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-bottom: 16px;
            transform: skewX(-3deg);
            text-shadow: 3px 3px 0 var(--accent);
        }
        .today-tagline {
            font-size: 1.1rem;
            color: var(--ink-dim);
            font-style: italic;
            margin-bottom: 24px;
        }
        .age-highlight {
            color: var(--yellow);
            font-weight: 700;
            font-style: normal;
        }
        .today-credits {
            display: grid;
            grid-template-columns: auto 1fr;
            gap: 8px 20px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.75rem;
            margin-bottom: 28px;
            padding: 20px 0;
            border-top: 1px solid rgba(255, 238, 214, 0.2);
            border-bottom: 1px solid rgba(255, 238, 214, 0.2);
        }
        .credit-label {
            color: var(--ink-mute);
            letter-spacing: 2px;
            text-transform: uppercase;
        }
        .credit-value { color: var(--ink); }
        .share-btn {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            padding: 14px 30px;
            background: var(--accent);
            color: var(--ink);
            border: none;
            font-family: 'Anton', sans-serif;
            font-weight: 400;
            font-size: 0.95rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            cursor: pointer;
            transition: background 0.3s, transform 0.2s, box-shadow 0.3s;
            align-self: flex-start;
            clip-path: polygon(8px 0, 100% 0, calc(100% - 8px) 100%, 0 100%);
        }
        .share-btn:hover {
            background: var(--accent-dark);
            box-shadow: 0 0 30px var(--accent-glow);
        }
        .share-btn:active { transform: translateY(1px); }
        /* ============================================================
         * TOOLBAR
         * ============================================================ */
        .toolbar {
            display: grid;
            grid-template-columns: 1fr auto auto;
            gap: 0;
            margin-bottom: 48px;
            border: 2px solid var(--line-strong);
            background: var(--bg-elev);
            animation: fadeInUp 1s 0.2s ease-out backwards;
            clip-path: polygon(0 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%);
        }
        .search-wrapper {
            position: relative;
            display: flex;
            align-items: center;
            border-right: 1px solid var(--line);
        }
        .search-icon {
            position: absolute;
            left: 18px;
            color: var(--ink-mute);
            font-size: 0.9rem;
            pointer-events: none;
        }
        .search-input {
            width: 100%;
            padding: 16px 44px 16px 44px;
            background: transparent;
            border: none;
            color: var(--ink);
            font-family: 'Inter Tight', sans-serif;
            font-size: 0.95rem;
            letter-spacing: 0.5px;
        }
        .search-input:focus { outline: none; }
        .search-input::placeholder { color: var(--ink-mute); font-style: italic; }
        .search-clear {
            position: absolute;
            right: 12px;
            background: var(--line);
            border: none;
            color: var(--ink-dim);
            width: 22px; height: 22px;
            cursor: pointer;
            display: none;
            align-items: center;
            justify-content: center;
            font-size: 0.7rem;
            transition: background 0.2s;
        }
        .search-clear.visible { display: flex; }
        .search-clear:hover { background: var(--accent); color: var(--ink); }
        .toolbar-select {
            padding: 16px 36px 16px 18px;
            background: transparent;
            border: none;
            border-left: 1px solid var(--line);
            color: var(--ink);
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.75rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            cursor: pointer;
            appearance: none;
            -webkit-appearance: none;
            background-image: url("data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22292.4%22%20height%3D%22292.4%22%3E%3Cpath%20fill%3D%22%23a5a29b%22%20d%3D%22M287%2069.4a17.6%2017.6%200%200%200-13-5.4H18.4c-5%200-9.3%201.8-12.9%205.4A17.6%2017.6%200%200%200%200%2082.2c0%205%201.8%209.3%205.4%2012.9l128%20127.9c3.6%203.6%207.8%205.4%2012.8%205.4s9.2-1.8%2012.8-5.4L287%2095c3.5-3.5%205.4-7.8%205.4-12.8%200-5-1.9-9.2-5.5-12.8z%22%2F%3E%3C%2Fsvg%3E");
            background-repeat: no-repeat;
            background-position: right 14px center;
            background-size: 8px;
            transition: background-color 0.2s, color 0.2s;
        }
        .toolbar-select:hover {
            background-color: rgba(232, 51, 46, 0.1);
            color: var(--accent);
        }
        .toolbar-select:focus {
            outline: none;
            background-color: rgba(232, 51, 46, 0.15);
        }
        .toolbar-select option { background: var(--bg-elev); color: var(--ink); }
        /* ============================================================
         * TOP 3 — Prochains épisodes
         * ============================================================ */
        .top3-section {
            margin-bottom: 80px;
            animation: fadeInUp 1s 0.3s ease-out backwards;
        }
        .top3-list {
            display: flex;
            gap: 28px;
            overflow-x: auto;
            padding: 8px 4px 28px;
            scrollbar-width: none;
            scroll-snap-type: x mandatory;
            -webkit-overflow-scrolling: touch;
        }
        .top3-list::-webkit-scrollbar { display: none; }
        /* ---- ★ OMAMORI (お守り) : la tuile pend à son cordon ----
           Trois pièces : le cordon noué, le corps en brocart aux
           épaules coupées, l'ourlet doré en bas. La photo est la
           fenêtre cousue au centre. */
        .top3-tile {
            position: relative;
            flex-shrink: 0;
            width: 280px;
            scroll-snap-align: start;
            color: inherit;
            display: block;
            transform-origin: 50% 4px;   /* elle pivote autour du nœud */
        }
        .top3-tile:hover { animation: omamoriSway 2.6s cubic-bezier(0.2, 0.7, 0.3, 1); }
        /* Un vrai balancement s'amortit : chaque oscillation est plus
           courte que la précédente, et jamais symétrique. */
        @keyframes omamoriSway {
            0%   { transform: rotate(0deg); }
            18%  { transform: rotate(2.4deg); }
            42%  { transform: rotate(-1.5deg); }
            64%  { transform: rotate(0.85deg); }
            82%  { transform: rotate(-0.35deg); }
            100% { transform: rotate(0deg); }
        }
        /* ---- LE NŒUD (叶結び) ----
           Une rosace plate : deux boucles qui se croisent, un cœur
           tressé, une bride qui monte pour la suspension et deux
           brins qui retombent sur le tissu. Le même dessin sert aux
           trois formats, seule sa largeur change. */
        .knot {
            display: block;
            overflow: visible;
            filter: drop-shadow(0 2px 3px rgba(0, 0, 0, 0.65));
        }
        .knot .knot-cord {
            fill: none;
            stroke: var(--cord);
            stroke-linecap: round;
            stroke-width: 5;
        }
        .knot .knot-core { fill: var(--cord); }
        .knot .knot-braid {                 /* le tressage du cœur */
            stroke: var(--cord-deep);
            stroke-width: 1.4;
            stroke-linecap: round;
        }
        .omamori-cord {
            display: block;
            position: relative;
            z-index: 4;
            margin-bottom: -28px;           /* les brins retombent sur le tissu */
        }
        .omamori-cord .knot { width: 132px; margin: 0 auto; }
        .omamori-body {
            position: relative;
            padding: 30px 26px 40px;
            /* Brocart : treillis de losanges au fil d'or, semé de
               points — le motif des vraies pochettes. */
            background-image:
                url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='30' height='30'><g fill='none' stroke='%23ffd23f' stroke-opacity='0.22' stroke-width='1'><path d='M15 0 L30 15 L15 30 L0 15 Z'/></g><g fill='%23ffd23f' fill-opacity='0.2'><circle cx='15' cy='15' r='1.7'/><circle cx='0' cy='0' r='1.7'/><circle cx='30' cy='0' r='1.7'/><circle cx='0' cy='30' r='1.7'/><circle cx='30' cy='30' r='1.7'/></g></svg>"),
                linear-gradient(168deg, #8a2020 0%, #581216 52%, #741a1b 100%);
            background-size: 30px 30px, auto;
            clip-path: polygon(0 17px, 17px 0, calc(100% - 17px) 0, 100% 17px, 100% 100%, 0 100%);
            box-shadow: 0 16px 34px rgba(0, 0, 0, 0.55);
            transition: box-shadow 0.35s;
        }
        .top3-tile:hover .omamori-body {
            box-shadow: 0 20px 42px rgba(0, 0, 0, 0.62), 0 0 34px var(--accent-glow);
        }
        .omamori-hem {
            position: absolute;
            left: 0; right: 0; bottom: 0;
            padding: 8px 0 10px;
            text-align: center;
            font-family: 'Noto Sans JP', sans-serif;
            font-weight: 700;
            font-size: 0.6rem;
            letter-spacing: 6px;
            color: var(--cord);
            background: linear-gradient(180deg, rgba(0,0,0,0.3), rgba(0,0,0,0.5));
            border-top: 1px solid rgba(255, 210, 63, 0.28);
        }
        .top3-rank-overlay {
            position: absolute;
            top: 4px;
            left: 8px;
            z-index: 5;
            font-family: 'Anton', sans-serif;
            font-size: 3.4rem;
            line-height: 0.9;
            color: var(--ink);
            text-shadow:
                3px 3px 0 var(--accent),
                6px 6px 12px rgba(0,0,0,0.8);
            transform: skewX(-6deg);
        }
        .top3-rank-overlay::before {
            content: 'NEXT';
            display: block;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.6rem;
            letter-spacing: 3px;
            color: var(--yellow);
            text-shadow: none;
            margin-bottom: -2px;
            transform: skewX(6deg);
        }
        /* Le portrait tient lieu de cartouche : sur les vraies
           omamori, c'est ce panneau clair au centre qui porte le
           texte. D'où le double filet ivoire. */
        .top3-image-container {
            position: relative;
            width: 100%;
            aspect-ratio: 2 / 3;
            overflow: hidden;
            background: var(--bg-elev);
            border: 2px solid rgba(239, 231, 215, 0.78);
            box-shadow:
                0 0 0 1px rgba(88, 18, 22, 0.9),
                0 0 0 4px rgba(239, 231, 215, 0.3),
                0 6px 16px rgba(0, 0, 0, 0.45);
        }
        .top3-tile-image,
        .top3-tile-placeholder {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: transform 0.6s ease;
        }
        .top3-tile:hover .top3-tile-image {
            transform: scale(1.05);
        }
        .top3-tile-placeholder {
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Anton', sans-serif;
            font-size: 7rem;
            color: var(--accent);
            background:
                radial-gradient(circle, rgba(242,239,233,0.06) 1px, transparent 1.2px) 0 0 / 8px 8px,
                linear-gradient(135deg, var(--bg-elev-2), var(--bg-elev));
        }
        .top3-tile-overlays {
            position: absolute;
            bottom: 0; left: 0; right: 0;
            padding: 60px 18px 18px;
            background: linear-gradient(to top, rgba(10, 10, 12, 0.98), rgba(10, 10, 12, 0.85) 40%, transparent);
        }
        .top3-tile-name {
            font-family: 'Anton', 'Noto Sans JP', sans-serif;
            font-size: 1.1rem;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            margin-bottom: 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .top3-tile-date {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.66rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            color: var(--ink-dim);
            letter-spacing: 2px;
            margin-bottom: 12px;
            text-transform: uppercase;
        }
        .top3-countdown { display: flex; gap: 4px; }
        .top3-countdown-item {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--line);
            padding: 6px 0;
            text-align: center;
            flex: 1;
        }
        .top3-countdown-value {
            font-family: 'JetBrains Mono', monospace;
            font-weight: 700;
            font-size: 1rem;
            color: var(--ink);
        }
        .top3-countdown-label {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.5rem;
            color: var(--ink-mute);
            text-transform: uppercase;
            margin-top: 2px;
            letter-spacing: 1.5px;
        }
        .top3-age-corner {
            position: absolute;
            top: 10px;
            right: 0;
            background: var(--yellow);
            color: var(--bg);
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.7rem;
            font-weight: 700;
            padding: 4px 14px;
            letter-spacing: 1px;
            z-index: 5;
            transform: skewX(-12deg);
        }
        /* ============================================================
         * MONTH GROUPS
         * ============================================================ */
        .month-section {
            margin-bottom: 56px;
        }
        /* ---- Révélation au scroll ----
           Chaque plaquette se pose en arrivant dans l'écran, avec un
           décalage sur ses voisines (--i). Le voile n'existe que si
           le script a tourné : sans lui, .has-reveal est absent et
           tout reste visible. */
        .has-reveal .reveal {
            opacity: 0;
            transform: translateY(18px) rotate(-1.4deg);
            transition: opacity 0.55s ease-out,
                        transform 0.7s cubic-bezier(0.2, 0.7, 0.3, 1);
            transition-delay: calc(var(--i, 0) * 45ms);
        }
        .has-reveal .reveal.in { opacity: 1; transform: none; }
        .month-header {
            display: flex;
            align-items: baseline;
            gap: 20px;
            margin-bottom: 28px;
            padding-bottom: 14px;
            border-bottom: 1px solid var(--line);
        }
        .month-name {
            font-family: 'Anton', 'Noto Sans JP', sans-serif;
            font-weight: 400;
            font-size: 1.5rem;
            letter-spacing: 3px;
            color: var(--ink);
            text-transform: uppercase;
        }
        .month-name.current { color: var(--accent); text-shadow: 2px 2px 0 rgba(232,51,46,0.25); }
        .month-num {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.7rem;
            color: var(--ink-mute);
            letter-spacing: 2px;
        }
        .month-count {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.7rem;
            color: var(--ink-dim);
            letter-spacing: 2px;
            margin-left: auto;
        }
        /* ============================================================
         * BIRTHDAY CARDS — Cases de manga
         * ============================================================ */
        .birthday-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
            gap: 22px 18px;
        }
        /* ---- ⛩ EMA (絵馬) : la plaquette de vœu accrochée ----
           Le fronton en pointe est un clip-path ; le bois, trois
           dégradés superposés (deux veines + le fond chaud). La
           carte elle-même n'est qu'un support : elle porte la
           cordelette et sert de pivot au balancement. */
        .birthday-card {
            position: relative;
            padding-top: 20px;
            transform-origin: 50% 6px;
        }
        .birthday-card:hover { animation: emaSway 2.2s cubic-bezier(0.2, 0.7, 0.3, 1); }
        @keyframes emaSway {
            0%   { transform: rotate(0deg); }
            20%  { transform: rotate(1.7deg); }
            45%  { transform: rotate(-1.1deg); }
            68%  { transform: rotate(0.55deg); }
            86%  { transform: rotate(-0.22deg); }
            100% { transform: rotate(0deg); }
        }
        .ema-cord {
            position: absolute;
            z-index: 3;
            top: 2px; left: 50%;
            width: 74px;
            transform: translateX(-50%);
            transition: filter 0.3s;
        }
        .ema-cord .knot { width: 100%; }
        .ema-plaque {
            position: relative;
            display: flex;
            gap: 16px;
            padding: 36px 16px 16px;
            background:
                repeating-linear-gradient(91deg, rgba(255,238,214,0.022) 0 1px, transparent 1px 6px),
                repeating-linear-gradient(89deg, rgba(0,0,0,0.16) 0 2px, transparent 2px 11px),
                linear-gradient(168deg, #2a2019 0%, #191310 58%, var(--wood) 100%);
            clip-path: polygon(50% 0, 100% 28px, 100% 100%, 0 100%, 0 28px);
            transition: filter 0.3s;
        }
        .birthday-card:hover .ema-plaque { filter: brightness(1.2); }
        .ema-plaque::before {            /* les deux trous du faîte */
            content: '';
            position: absolute;
            top: 17px; left: 50%;
            width: 40px; height: 5px;
            transform: translateX(-50%);
            background:
                radial-gradient(circle at 4px 50%,  rgba(0,0,0,0.85) 0 2.2px, transparent 2.4px),
                radial-gradient(circle at 36px 50%, rgba(0,0,0,0.85) 0 2.2px, transparent 2.4px);
        }
        .ema-plaque::after {             /* le liseré vermillon sous le fronton */
            content: '';
            position: absolute;
            top: 28px; left: 0; right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(232,51,46,0.35), transparent);
        }
        .birthday-card.imminent .ema-plaque {
            background:
                repeating-linear-gradient(91deg, rgba(255,238,214,0.03) 0 1px, transparent 1px 6px),
                repeating-linear-gradient(89deg, rgba(0,0,0,0.16) 0 2px, transparent 2px 11px),
                linear-gradient(168deg, #3a1c18 0%, #24100e 58%, #2e1512 100%);
        }
        .birthday-card.imminent .ema-cord {
            filter: drop-shadow(0 0 7px var(--accent-glow));
        }
        /* Toute plaquette décrochable ouvre sa carte de vœux */
        [data-uid] { cursor: pointer; }
        /* Moins de 24 h : la cordelette respire. Une pulsation toutes
           les 4 s — assez lente pour qu'on la remarque sans qu'elle
           attire l'œil en permanence. */
        .birthday-card.last-day .ema-cord {
            animation: cordPulse 4s ease-in-out infinite;
        }
        @keyframes cordPulse {
            0%, 100% { filter: drop-shadow(0 0 3px var(--accent-glow)); }
            50%      { filter: drop-shadow(0 0 12px var(--accent)); }
        }
        .avatar-container {
            position: relative;
            flex-shrink: 0;
            width: 62px;
            height: 92px;
            overflow: hidden;
            background: var(--bg-elev-2);
            border: 1px solid rgba(255, 210, 63, 0.22);
            box-shadow: 0 0 0 2px rgba(0, 0, 0, 0.45);
        }
        .avatar {
            width: 100%; height: 100%;
            object-fit: cover;
            transition: transform 0.4s ease;
        }
        .birthday-card:hover .avatar { transform: scale(1.05); }
        .avatar-placeholder {
            width: 100%; height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Anton', sans-serif;
            font-size: 1.8rem;
            color: var(--accent);
            background:
                radial-gradient(circle, rgba(242,239,233,0.06) 1px, transparent 1.2px) 0 0 / 6px 6px,
                linear-gradient(135deg, var(--bg-elev-2), var(--bg-elev));
        }
        .card-content {
            flex: 1;
            min-width: 0;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .user-name {
            font-family: 'Anton', 'Noto Sans JP', sans-serif;
            font-weight: 400;
            font-size: 1rem;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-bottom: 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            line-height: 1.3;
        }
        .birthday-date {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.66rem;
            color: var(--ink-dim);
            letter-spacing: 0.8px;
            margin-bottom: 8px;
            text-transform: uppercase;
            white-space: nowrap;         /* garde « MERCREDI · 02 · SEPTEMBRE » sur une ligne */
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .countdown-mini {
            display: flex;
            gap: 4px;
            margin-bottom: 8px;
        }
        .countdown-mini-item {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.7rem;
            background: rgba(255, 238, 214, 0.05);
            border: 1px solid rgba(255, 238, 214, 0.12);
            padding: 3px 7px;
            color: var(--ink);
            min-width: 32px;
            text-align: center;
            letter-spacing: 1px;
        }
        .countdown-mini-item .unit {
            color: var(--ink-mute);
            margin-left: 2px;
        }
        .imminent .countdown-mini-item {
            background: rgba(232, 51, 46, 0.15);
            border-color: rgba(232, 51, 46, 0.4);
        }
        .age-info {
            display: flex;
            align-items: center;
            gap: 8px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.7rem;
            letter-spacing: 1px;
        }
        .current-age { color: var(--ink-mute); }
        .arrow { color: var(--ink-mute); }
        .upcoming-age { color: var(--yellow); font-weight: 700; }
        /* ============================================================
         * STATS — Fiche technique
         * ============================================================ */
        .stats-section {
            margin-top: 80px;
            padding-top: 48px;
            border-top: 2px solid var(--line-strong);
            animation: fadeInUp 1s 0.5s ease-out backwards;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 0;
            border: 2px solid var(--line-strong);
            background: var(--bg-elev);
        }
        .stat-card {
            padding: 28px 24px;
            border-right: 1px solid var(--line);
            border-bottom: 1px solid var(--line);
            transition: background 0.3s;
            position: relative;
        }
        .stat-card:hover {
            background: rgba(232, 51, 46, 0.05);
        }
        .stat-icon {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.65rem;
            color: var(--accent);
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-bottom: 10px;
            display: block;
        }
        .stat-value {
            font-family: 'Anton', sans-serif;
            font-size: 2.4rem;
            line-height: 1;
            color: var(--ink);
            margin-bottom: 6px;
            letter-spacing: 1px;
        }
        .stat-value.numeric {
            font-family: 'JetBrains Mono', monospace;
            font-weight: 700;
            font-size: 1.8rem;
        }
        .stat-label {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.7rem;
            color: var(--ink-dim);
            letter-spacing: 2px;
            text-transform: uppercase;
        }
        /* Casting par âge */
        .casting-scroll-container {
            margin-top: 40px;
            border: 2px solid var(--line-strong);
            background: var(--bg-elev);
            padding: 32px;
            clip-path: polygon(0 0, 100% 0, 100% calc(100% - var(--cut)), calc(100% - var(--cut)) 100%, 0 100%);
        }
        .casting-title {
            font-family: 'Anton', 'Noto Sans JP', sans-serif;
            letter-spacing: 3px;
            text-align: center;
            margin-bottom: 32px;
            font-size: 1rem;
            color: var(--accent);
            text-transform: uppercase;
        }
        .casting-title .jp {
            display: block;
            font-family: 'Noto Sans JP', sans-serif;
            font-weight: 700;
            font-size: 0.65rem;
            color: var(--ink-mute);
            letter-spacing: 6px;
            margin-top: 6px;
        }
        #casting-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
        }
        .casting-item {
            border-left: 3px solid var(--accent);
            padding-left: 12px;
            margin-bottom: 10px;
        }
        .casting-age {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.85rem;
            color: var(--yellow);
            font-weight: 700;
        }
        .casting-name {
            font-family: 'Inter Tight', sans-serif;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--ink);
        }
        .casting-year {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.6rem;
            color: var(--ink-mute);
        }
        /* ============================================================
         * NO RESULTS
         * ============================================================ */
        .no-results {
            grid-column: 1 / -1;
            text-align: center;
            padding: 80px 20px;
            color: var(--ink-mute);
            font-style: italic;
            letter-spacing: 2px;
        }
        .no-results-mark {
            font-family: 'Anton', sans-serif;
            font-size: 4rem;
            color: var(--accent);
            margin-bottom: 16px;
            opacity: 0.5;
        }
        /* ============================================================
         * MODAL PARTAGE
         * ============================================================ */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.95);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2000;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.4s, visibility 0.4s;
        }
        .modal-overlay.active { opacity: 1; visibility: visible; }
        .modal-content {
            background: var(--bg-elev);
            border: 2px solid var(--border-ink);
            padding: 32px;
            max-width: 500px;
            width: 90%;
            transform: scale(0.95);
            transition: transform 0.4s cubic-bezier(0.2, 0.6, 0.2, 1);
            position: relative;
            clip-path: polygon(0 0, 100% 0, 100% calc(100% - 18px), calc(100% - 18px) 100%, 0 100%);
        }
        .modal-overlay.active .modal-content { transform: scale(1); }
        .modal-close {
            position: absolute;
            top: 14px; right: 14px;
            background: transparent;
            border: 1px solid var(--line-strong);
            color: var(--ink);
            width: 32px; height: 32px;
            cursor: pointer;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.3s, transform 0.2s;
        }
        .modal-close:hover { background: var(--accent); border-color: var(--accent); }
        .modal-title {
            font-family: 'Anton', 'Noto Sans JP', sans-serif;
            font-weight: 400;
            font-size: 1.3rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-bottom: 20px;
            text-align: center;
        }
        .share-card-preview {
            width: 300px; height: 450px;
            margin: 0 auto 20px;
            overflow: hidden;
            background: var(--bg);
            border: 1px solid var(--line);
        }
        .share-card-canvas { display: block; width: 100%; height: 100%; }
        .generating-text {
            text-align: center;
            padding: 10px;
            color: var(--accent);
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.8rem;
            letter-spacing: 2px;
            display: none;
        }
        .generating-text.active { display: block; }
        .share-action-btn {
            width: 100%;
            padding: 14px 20px;
            background: var(--accent);
            color: var(--ink);
            border: none;
            font-family: 'Anton', sans-serif;
            font-weight: 400;
            font-size: 0.95rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            cursor: pointer;
            transition: background 0.3s, box-shadow 0.3s;
            clip-path: polygon(8px 0, 100% 0, calc(100% - 8px) 100%, 0 100%);
        }
        .share-action-btn:hover {
            background: var(--accent-dark);
            box-shadow: 0 0 30px var(--accent-glow);
        }
        /* ============================================================
         * TOAST
         * ============================================================ */
        .toast {
            position: fixed;
            bottom: 32px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: var(--bg-elev);
            border: 2px solid var(--accent);
            color: var(--ink);
            padding: 14px 28px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.8rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            z-index: 3000;
            opacity: 0;
            transition: transform 0.4s, opacity 0.4s;
            clip-path: polygon(8px 0, 100% 0, calc(100% - 8px) 100%, 0 100%);
        }
        .toast.active { transform: translateX(-50%) translateY(0); opacity: 1; }
        /* ============================================================
         * OUVERTURE DE LA CARTE DE VŒUX
         * Un seul écouteur par conteneur, posé une fois : les cartes
         * sont recréées à chaque filtre, y attacher un handler
         * individuel les ferait fuir.
         * ============================================================ */
        function bindCardOpen(id) {
            const root = document.getElementById(id);
            if (!root) return;
            const open = (target) => {
                const card = target.closest('[data-uid]');
                if (!card) return false;
                const u = users[Number(card.dataset.uid)];
                if (!u) return false;
                openShareModal(u);
                return true;
            };
            root.addEventListener('click', e => open(e.target));
            root.addEventListener('keydown', e => {
                if (e.key !== 'Enter' && e.key !== ' ') return;
                if (open(e.target)) e.preventDefault();
            });
        }
        /* ============================================================
         * SCROLL TO TOP
         * ============================================================ */
        .scroll-top {
            position: fixed;
            bottom: 24px; right: 24px;
            width: 48px; height: 48px;
            background: var(--bg-elev);
            border: 2px solid var(--line-strong);
            color: var(--ink);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'JetBrains Mono', monospace;
            font-size: 1.1rem;
            opacity: 0;
            visibility: hidden;
            transform: translateY(12px);
            transition: opacity 0.3s, visibility 0.3s, transform 0.3s, background 0.3s;
            z-index: 999;
        }
        .scroll-top.visible {
            opacity: 1; visibility: visible; transform: translateY(0);
        }
        .scroll-top:hover { background: var(--accent); border-color: var(--accent); }
/*__ZAP_CSS__*/
        /* ============================================================
         * FOUDRE — carte « À l'honneur » uniquement.
         * Purement additif : la bordure, le fond et la mise en page
         * du poster ne sont pas touchés. Deux calques en overlay.
         * ============================================================ */
        .zap-hero {
            /* Teintes du plasma. Pour rester dans le thème manga :
               --volt: #ffd23f; --volt-hot: #fff3c4; --volt-deep: #e8332e; */
            --volt: #8fc2ff;
            --volt-hot: #d8ecff;
            --volt-deep: #2f6dff;
        }
        .zap-hero .zap-svg {
            position: absolute;
            top: -10%;
            left: 0;
            width: 100%;
            height: 120%;
            pointer-events: none;
            overflow: visible;
            z-index: 4;
        }
        /* Lueur des bords, synchronisée avec les décharges.
           En « inset » car le clip-path du poster découperait
           une ombre extérieure classique. */
        .zap-hero .zap-glow {
            position: absolute;
            inset: 0;
            pointer-events: none;
            opacity: 0;
            z-index: 2;
            box-shadow:
                inset 0 0 26px 2px var(--volt),
                inset 0 0 60px 6px var(--volt-deep);
            transition: opacity 45ms linear;
        }
        .zap-hero .zap-flash {
            position: absolute;
            inset: 0;
            background:
                linear-gradient(180deg, rgba(143, 194, 255, 0.32), rgba(143, 194, 255, 0.03) 60%, transparent),
                radial-gradient(ellipse at 50% -10%, rgba(255, 255, 255, 0.4), transparent 65%);
            mix-blend-mode: screen;
            pointer-events: none;
            opacity: 0;
            z-index: 3;
            transition: opacity 40ms linear;
        }
        @media (prefers-reduced-motion: reduce) {
            .zap-hero .zap-svg,
            .zap-hero .zap-glow,
            .zap-hero .zap-flash { display: none !important; }
        }
        /* ============================================================
         * ⛩ ARRIÈRE-PLAN — plan d'opening d'anime
         *
         * Huit calques, du fond vers l'avant :
         *   #bg-sky      ciel crépusculaire + halos + filigrane JP
         *   #bg-rays     rayons de lumière qui balaient
         *   #bg-clouds   deux bancs de nuages en parallaxe
         *   #bg-canvas   Fuji, étoiles, filantes, bokeh, pétales
         *   #bg-horizon  silhouette de ville + torii
         *   #bg-grain    grain de pellicule
         *   ── puis body::before (vignette, z1), .container (z2),
         *      screentone body::after (z9999)
         *
         * Tous créés en JS (bloc « CIEL ANIMÉ » à la fin du script) :
         * couper une option dans l'objet BG suffit à faire disparaître
         * le calque correspondant.
         * ============================================================ */
        #bg-sky, #bg-canvas, #bg-grain {
            position: fixed;
            pointer-events: none;
            z-index: 0;
        }
        /* ---- Le ciel : nuit en haut, braises rouges à l'horizon ----
           Volontairement STATIQUE. Un dégradé plein écran qui s'anime
           doit être repeint à chaque image ; le mouvement vient des
           nuages et de la parallaxe, pas du ciel lui-même. */
        #bg-sky {
            inset: 0;
            background:
                radial-gradient(ellipse 120% 62% at 50% 104%, rgba(232, 51, 46, 0.17), transparent 62%),
                radial-gradient(ellipse 90% 44% at 76% 92%,  rgba(255, 140, 60, 0.075), transparent 62%),
                radial-gradient(circle at 17% 13%, rgba(116, 92, 214, 0.11), transparent 48%),
                radial-gradient(circle at 88% 22%, rgba(232, 51, 46, 0.06), transparent 42%),
                linear-gradient(180deg,
                    #06060a 0%, #09090f 34%, #110d1b 62%, #180f1f 84%, #1f1124 100%);
        }
        /* Filigrane vertical façon tranche de tome.
           Pour l'enlever : supprimer ce bloc. Texte : propriété content. */
        #bg-sky::before {
            content: '誕生日スペシャル';
            position: absolute;
            top: 50%;
            right: 13%;
            transform: translateY(-50%);
            writing-mode: vertical-rl;
            font-family: 'Noto Sans JP', sans-serif;
            font-weight: 900;
            font-size: clamp(6rem, 16vw, 15rem);
            letter-spacing: 0.14em;
            color: var(--ink);
            opacity: 0.022;
            white-space: nowrap;
        }
        /* Rayons de lumière et nuages sont eux aussi dans #bg-canvas :
           pré-rendus une fois, puis recopiés tels quels à chaque image.
           En CSS animé, ils coûtaient à eux seuls les deux tiers du
           budget d'affichage. */
        /* ---- Décor, étoiles, filantes, bokeh, pétales ---- */
        #bg-canvas { inset: 0; }
        /* Le décor (Fuji, montagnes, village, poteaux, lune) est
           entièrement dessiné dans #bg-canvas — voir « CIEL ANIMÉ ». */
        /* ---- Grain de pellicule, par-dessus tout le décor ---- */
        #bg-grain {
            inset: 0;
            background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/></filter><rect width='160' height='160' filter='url(%23n)' opacity='0.45'/></svg>");
            opacity: 0.3;
            mix-blend-mode: overlay;
        }
        /* Le burst du titre tourne très lentement — vivant, pas remarquable */
        header::before {
            animation: burstSpin 120s linear infinite;
        }
        @keyframes burstSpin {
            from { transform: translate(-50%, -55%) rotate(0deg); }
            to   { transform: translate(-50%, -55%) rotate(360deg); }
        }
        /* Idem derrière l'avatar du jour, en sens inverse */
        .today-poster::before {
            animation: posterSpin 80s linear infinite;
        }
        @keyframes posterSpin {
            from { transform: translate(-50%, -50%) rotate(360deg); }
            to   { transform: translate(-50%, -50%) rotate(0deg); }
        }
        @media (prefers-reduced-motion: reduce) {
            #bg-sky, #bg-rays { animation: none; }
            #bg-clouds::before, #bg-clouds::after { animation: none; }
            #bg-canvas { display: none; }
            header::before, .today-poster::before { animation: none; }
        }
        /* ============================================================
         * MOBILE
         * ============================================================ */
        @media (max-width: 900px) {
            .today-poster {
                grid-template-columns: 1fr;
                padding: 54px 24px 28px;
                gap: 28px;
            }
            .today-frame { --gable: 34px; }
            .today-poster::before { left: 50%; top: 180px; }
            .today-image-wrap {
                max-width: 240px;
                margin: 0 auto;
            }
            .toolbar {
                grid-template-columns: 1fr;
            }
            .search-wrapper { border-right: none; border-bottom: 1px solid var(--line); }
            .toolbar-select {
                border-left: none;
                border-bottom: 1px solid var(--line);
            }
            .toolbar > *:last-child { border-bottom: none; }
        }
        @media (max-width: 600px) {
            .container { padding: 32px 16px 80px; }
            .header-meta { flex-direction: column; gap: 8px; }
            .stats-grid { grid-template-columns: 1fr; }
            .top3-tile { width: 240px; }
            .month-header { flex-wrap: wrap; gap: 6px 14px; }
            .month-count { font-size: 0.62rem; }
            .today-poster::after { display: none; }
            #bg-sky::before { display: none; }
        }
    </style>
</head>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gif.js/0.2.0/gif.js"></script>
    <script>
        'use strict';
        /* ============================================================
         * DONNÉES
         * ============================================================ */
        const today = new Date();
        const monthNames = ['janvier', 'février', 'mars', 'avril', 'mai', 'juin',
            'juillet', 'août', 'septembre', 'octobre', 'novembre', 'décembre'];
        const dayNames = ['dimanche', 'lundi', 'mardi', 'mercredi', 'jeudi',
            'vendredi', 'samedi'];
        function capitalize(s) { return s.charAt(0).toUpperCase() + s.slice(1); }
        const monthNamesShort = ['JANVIER', 'FÉVRIER', 'MARS', 'AVRIL', 'MAI', 'JUIN',
            'JUILLET', 'AOÛT', 'SEPTEMBRE', 'OCTOBRE', 'NOVEMBRE', 'DÉCEMBRE'];
        /* Images de repli, utilisées quand il n'y a pas d'ID Discord
           (ou que la personne n'est pas sur le serveur Lanyard). */
        const avatarsParGenre = {
            homme: 'homme.jpg',
            femme: 'femme.jpg'
        };
        /* ★ SOURCE UNIQUE : la liste vit dans birthdays.json (à la racine du repo).
           Le site ET le bot Discord lisent le même fichier.
           Pour ajouter quelqu'un → éditer birthdays.json, rien d'autre. */
        let users = [];
        /* ============================================================
         * ⚡ MOTEUR DE FOUDRE — piloté en JS, jamais deux fois pareil
         *
         * Contrairement à une animation CSS qui boucle, chaque décharge
         * régénère sa géométrie, son intensité, son nombre d'arcs de
         * retour et son délai d'attente. Rien ne se répète.
         * ============================================================ */
        (function (global) {
            'use strict';
            const SVG_NS = 'http://www.w3.org/2000/svg';
            const rand = (a, b) => a + Math.random() * (b - a);
            const randInt = (a, b) => Math.floor(rand(a, b + 1));
            const pick = arr => arr[Math.floor(Math.random() * arr.length)];
            /* --- Géométrie fractale (déplacement de point médian) --- */
            function fractal(x1, y1, x2, y2, cfg) {
                let segs = [[{ x: x1, y: y1 }, { x: x2, y: y2 }]];
                const branches = [];
                let off = cfg.offset;
                for (let lvl = 0; lvl < cfg.detail; lvl++) {
                    const next = [];
                    for (const [a, b] of segs) {
                        const dx = b.x - a.x, dy = b.y - a.y;
                        const len = Math.hypot(dx, dy) || 1;
                        const px = -dy / len, py = dx / len;
                        const d = rand(-off, off);
                        const mid = { x: (a.x + b.x) / 2 + px * d, y: (a.y + b.y) / 2 + py * d };
                        next.push([a, mid], [mid, b]);
                        if (lvl > 1 && lvl < cfg.detail - 1 && Math.random() < cfg.branch) {
                            const ang = Math.atan2(b.y - mid.y, b.x - mid.x)
                                      + (Math.random() < 0.5 ? -1 : 1) * rand(0.3, 0.95);
                            const bl = len * rand(0.35, 1.3);
                            branches.push(fractal(mid.x, mid.y,
                                mid.x + Math.cos(ang) * bl, mid.y + Math.sin(ang) * bl,
                                { detail: randInt(2, 4), offset: off * 0.7, branch: 0.12 }).main);
                        }
                    }
                    segs = next;
                    off *= cfg.decay;
                }
                return { main: [segs[0][0], ...segs.map(s => s[1])], branches };
            }
            const toD = pts => 'M' + pts.map(p => `${p.x.toFixed(1)} ${p.y.toFixed(1)}`).join(' L');
            /* --- Un canal de foudre : plusieurs couches sur le même tracé --- */
            class Channel {
                constructor(svg, paths, scale) {
                    this.g = document.createElementNS(SVG_NS, 'g');
                    this.layers = [];
                    const specs = [
                        { stroke: 'var(--volt-deep)', w: 24 * scale, blur: 11,  op: 0.26 },
                        { stroke: 'var(--volt)',      w: 9 * scale,  blur: 3.5, op: 0.68 },
                        { stroke: 'var(--volt-hot)',  w: 4 * scale,  blur: 1.2, op: 0.9 },
                        { stroke: '#ffffff',          w: 2 * scale,  blur: 0,   op: 1 },
                    ];
                    for (const s of specs) {
                        const lg = document.createElementNS(SVG_NS, 'g');
                        lg.setAttribute('filter', s.blur ? `blur(${s.blur}px)` : '');
                        lg.style.filter = s.blur ? `blur(${s.blur}px)` : 'none';
                        lg.dataset.op = s.op;
                        for (const d of paths) {
                            const p = document.createElementNS(SVG_NS, 'path');
                            p.setAttribute('d', d);
                            p.setAttribute('fill', 'none');
                            p.setAttribute('stroke', s.stroke);
                            p.setAttribute('stroke-width', s.w);
                            p.setAttribute('stroke-linecap', 'round');
                            p.setAttribute('stroke-linejoin', 'round');
                            p.setAttribute('vector-effect', 'non-scaling-stroke');
                            lg.appendChild(p);
                        }
                        this.g.appendChild(lg);
                        this.layers.push(lg);
                    }
                    this.g.style.opacity = '0';
                    svg.appendChild(this.g);
                }
                setOpacity(v) { this.g.style.opacity = String(v); }
                destroy() { this.g.remove(); }
            }
            /* --- Le moteur --- */
            class Lightning {
                constructor(el, opts) {
                    this.el = el;
                    this.o = Object.assign({
                        intensity: 0.5,   // 0 = lointain, 1 = surcharge
                        mode: 'strike',   // 'strike' (tombe du haut) | 'border' (longe le cadre)
                        corona: false,    // micro-arcs permanents sur le cadre
                        flash: false,     // embrasement de la carte
                        shake: 0,         // amplitude de la secousse en px
                        w: 200, h: 300,
                    }, opts || {});
                    this.svg = document.createElementNS(SVG_NS, 'svg');
                    this.svg.setAttribute('viewBox', `0 0 ${this.o.w} ${this.o.h}`);
                    this.svg.setAttribute('preserveAspectRatio', 'none');
                    this.svg.setAttribute('aria-hidden', 'true');
                    this.svg.className.baseVal = 'zap-svg';
                    el.appendChild(this.svg);
                    if (this.o.flash) {
                        this.flashEl = document.createElement('div');
                        this.flashEl.className = 'zap-flash';
                        this.flashEl.setAttribute('aria-hidden', 'true');
                        el.appendChild(this.flashEl);
                    }
                    if (this.o.glow) {
                        this.glowEl = document.createElement('div');
                        this.glowEl.className = 'zap-glow';
                        this.glowEl.setAttribute('aria-hidden', 'true');
                        el.appendChild(this.glowEl);
                    }
                    this.alive = true;
                    this.timers = [];
                    this.visible = true;
                    if ('IntersectionObserver' in window) {
                        this.io = new IntersectionObserver(e => { this.visible = e[0].isIntersecting; },
                            { rootMargin: '120px' });
                        this.io.observe(el);
                    }
                    this.scheduleStrike(rand(200, 2000));
                    if (this.o.corona) this.scheduleCorona(rand(100, 800));
                }
                after(fn, ms) {
                    const t = setTimeout(() => { if (this.alive) fn(); }, ms);
                    this.timers.push(t);
                    return t;
                }
                /* Délai jusqu'au prochain coup : distribution à queue longue,
                   donc parfois deux coups collés, parfois un long silence. */
                nextDelay() {
                    const i = this.o.intensity;
                    const base = 5000 - i * 3400;          // 5,0 s → 1,6 s
                    const u = Math.random();
                    return base * (0.3 + Math.pow(u, 2.2) * 2.4);
                }
                makeGeometry() {
                    const { w, h, mode } = this.o;
                    const i = this.o.intensity;
                    if (mode === 'border') {
                        const side = randInt(0, 3);
                        const t = rand(0.02, 0.5), span = rand(0.4, 0.95);
                        let a, b;
                        if (side === 0)      { a = { x: w * t, y: 0 };        b = { x: w * Math.min(1, t + span), y: 0 }; }
                        else if (side === 1) { a = { x: w, y: h * t };        b = { x: w, y: h * Math.min(1, t + span) }; }
                        else if (side === 2) { a = { x: w * Math.min(1, t + span), y: h }; b = { x: w * t, y: h }; }
                        else                 { a = { x: 0, y: h * Math.min(1, t + span) }; b = { x: 0, y: h * t }; }
                        return fractal(a.x, a.y, b.x, b.y, {
                            detail: randInt(5, 6), offset: Math.min(w, h) * rand(0.05, 0.13),
                            decay: rand(0.48, 0.6), branch: 0.15 + i * 0.3,
                        });
                    }
                    // mode strike : tombe du haut, longueur et inclinaison variables
                    const x1 = rand(-w * 0.1, w * 1.1);
                    const x2 = x1 + rand(-w * 0.45, w * 0.45);
                    const y2 = h * rand(0.45, 1.15);
                    return fractal(x1, -h * rand(0.15, 0.35), x2, y2, {
                        detail: randInt(6, 7), offset: w * rand(0.15, 0.28),
                        decay: rand(0.55, 0.65), branch: 0.18 + i * 0.22,
                    });
                }
                /* Un coup = un canal + N arcs de retour qui réempruntent le
                   même canal (comme la foudre réelle), chacun avec son propre
                   scintillement. */
                strike() {
                    if (!this.visible) { this.scheduleStrike(this.nextDelay()); return; }
                    const i = this.o.intensity;
                    const geo = this.makeGeometry();
                    const paths = [toD(geo.main), ...geo.branches.map(toD)];
                    const scale = rand(0.95, 1.5) * (0.8 + i * 0.6);
                    const ch = new Channel(this.svg, paths, scale);
                    const power = rand(0.7, 1) * (0.6 + i * 0.5);
                    let t = 0;
                    // 1. Précurseur : faible, il descend
                    ch.setOpacity(0);
                    this.after(() => ch.setOpacity(0.18 * power), t += rand(0, 30));
                    this.after(() => ch.setOpacity(0.3 * power), t += rand(25, 60));
                    // 2. Arcs de retour : 1 à 4, intensités inégales
                    const returns = randInt(1, 2 + Math.round(i * 2));
                    for (let r = 0; r < returns; r++) {
                        const peak = Math.min(1, power * rand(0.55, 1.15));
                        this.after(() => ch.setOpacity(peak), t += rand(15, 45));
                        this.after(() => ch.setOpacity(peak * rand(0.05, 0.3)), t += rand(18, 50));
                        this.after(() => ch.setOpacity(peak * rand(0.6, 1)), t += rand(20, 55));
                        if (r === 0 && this.o.flash) this.flash(peak);
                        if (r === 0 && this.o.glow) this.glow(peak);
                        if (r === 0 && this.o.shake) this.shake(power);
                    }
                    // 3. Rémanence puis extinction
                    this.after(() => ch.setOpacity(0.22 * power), t += rand(30, 70));
                    this.after(() => ch.setOpacity(0.09 * power), t += rand(60, 140));
                    this.after(() => { ch.setOpacity(0); ch.destroy(); }, t += rand(90, 220));
                    // Parfois, un second canal frappe juste après, ailleurs
                    if (Math.random() < 0.12 + i * 0.2) {
                        this.after(() => this.strike(), rand(90, 400));
                        return;
                    }
                    this.scheduleStrike(this.nextDelay());
                }
                scheduleStrike(ms) { this.after(() => this.strike(), ms); }
                /* La lueur des bords suit la décharge : montée immédiate,
                   creux, rebond, puis extinction lente (rémanence). */
                glow(power) {
                    if (!this.glowEl) return;
                    const g = this.glowEl;
                    const seq = [
                        [0, 0.55 * power], [rand(25, 55), 0.1], [rand(20, 50), 0.42 * power],
                        [rand(30, 65), 0.06], [rand(40, 90), 0.24 * power],
                        [rand(80, 150), 0.1 * power], [rand(150, 320), 0],
                    ];
                    let acc = 0;
                    for (const [d, v] of seq) { acc += d; this.after(() => { g.style.opacity = v; }, acc); }
                }
                flash(power) {
                    if (!this.flashEl) return;
                    const f = this.flashEl;
                    const seq = [
                        [0, 0.5 * power], [rand(20, 45), 0.06], [rand(20, 50), 0.34 * power],
                        [rand(30, 60), 0.03], [rand(40, 90), 0.16 * power], [rand(90, 180), 0],
                    ];
                    let acc = 0;
                    for (const [d, v] of seq) { acc += d; this.after(() => { f.style.opacity = v; }, acc); }
                }
                shake(power) {
                    const el = this.el;
                    const amp = this.o.shake * power;
                    const steps = randInt(4, 7);
                    let acc = 0;
                    for (let s = 0; s < steps; s++) {
                        const k = 1 - s / steps;
                        acc += rand(18, 45);
                        this.after(() => {
                            el.style.transform =
                                `translate(${rand(-amp, amp) * k}px, ${rand(-amp, amp) * k}px) skewX(${rand(-0.9, 0.9) * k}deg)`;
                        }, acc);
                    }
                    this.after(() => { el.style.transform = ''; }, acc + 40);
                }
                /* Micro-arcs qui grésillent sur le cadre, régénérés en continu */
                scheduleCorona(ms) {
                    this.after(() => {
                        if (this.visible) this.corona();
                        this.scheduleCorona(rand(200, 950) * (1.6 - this.o.intensity));
                    }, ms);
                }
                corona() {
                    const { w, h } = this.o;
                    const side = randInt(0, 3);
                    const t = rand(0.05, 0.8), span = rand(0.06, 0.22);

                ctx.fillRect((W - bw) / 2, 350, bw, 24);
                ctx.fillStyle = '#33090b';
                ctx.fillText(label, W / 2, 366);

                // le vœu
                ctx.fillStyle = 'rgba(255,232,190,0.95)';
                ctx.font = '700 14px "Noto Sans JP", sans-serif';
                ctx.fillText('誕生日おめでとう', W / 2, 404);

                ctx.strokeStyle = 'rgba(255,210,63,0.3)';
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.moveTo(W / 2 - 54, 413);
                ctx.lineTo(W / 2 + 54, 413);
                ctx.stroke();

                ctx.fillStyle = 'rgba(255,232,190,0.5)';
                ctx.font = '8px JetBrains Mono, monospace';
                ctx.fillText('— ANNIVERSAIRES —', W / 2, 425);

                // les confettis passent devant la pochette
                this.particles.forEach(p => this.drawParticle(p));
            }
            drawParticle(p) {
                const ctx = this.ctx;
                ctx.save();
                ctx.translate(p.x, p.y);
                ctx.rotate(p.rotation * Math.PI / 180);
                ctx.scale(1, Math.cos(p.tilt));
                ctx.globalAlpha = p.opacity;
                ctx.fillStyle = p.color;
                if (p.shape === 'square') ctx.fillRect(-p.width/2, -p.height/2, p.width, p.height);
                else if (p.shape === 'circle') { ctx.beginPath(); ctx.arc(0, 0, p.width/2, 0, Math.PI*2); ctx.fill(); }
                else { ctx.beginPath(); ctx.moveTo(-p.width/2, -p.height/2); ctx.lineTo(p.width/2, -p.height/4); ctx.lineTo(p.width/2, p.height/2); ctx.lineTo(-p.width/2, p.height/4); ctx.closePath(); ctx.fill(); }
                ctx.restore();
            }
            updateParticle(p) {
                p.velocityY += p.gravity;
                p.velocityX *= p.drag;
                p.velocityY *= p.drag;
                p.x += p.velocityX + Math.sin(p.wobble) * 0.6;
                p.y += p.velocityY;
                p.rotation += p.rotationSpeed;
                p.wobble += p.wobbleSpeed;
                p.tilt += 0.01;
                if (p.y > this.height - 80) p.opacity -= 0.02;
                return p.y < this.height + 20 && p.opacity > 0;
            }
            animate() {
                if (!this.running) return;
                if (this.particles.length < 50 && Math.random() > 0.75) this.particles.push(this.createParticle(true));
                this.particles = this.particles.filter(p => this.updateParticle(p));
                this.drawCard();
                cardAnimationId = requestAnimationFrame(() => this.animate());
            }
            start() {
                this.running = true;
                for (let i = 0; i < 20; i++) this.particles.push(this.createParticle(false));
                this.animate();
            }
            stop() { this.running = false; if (cardAnimationId) cancelAnimationFrame(cardAnimationId); }
            clear() { this.particles = []; this.ctx.clearRect(0, 0, this.width, this.height); }
        }

        const visibleCountdowns = new Set();
        let countdownObserver = null;
        function initCountdownObserver() {
            if (countdownObserver) countdownObserver.disconnect();
            visibleCountdowns.clear();
            countdownObserver = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) visibleCountdowns.add(entry.target);
                    else visibleCountdowns.delete(entry.target);
                });
            }, { rootMargin: '100px' });
            document.querySelectorAll('[data-countdown]').forEach(el => countdownObserver.observe(el));
        }
        /* ============================================================
         * RÉVÉLATION AU SCROLL
         * Une seule fois par élément : on cesse de l'observer dès
         * qu'il est apparu, sinon la grille se re-révèle à chaque
         * remontée et l'effet devient un clignotement.
         * ============================================================ */
        let revealObserver = null;
        function initRevealObserver() {
            if (!revealObserver) {
                revealObserver = new IntersectionObserver((entries) => {
                    entries.forEach(e => {
                        if (!e.isIntersecting) return;
                        e.target.classList.add('in');
                        revealObserver.unobserve(e.target);
                    });
                }, { rootMargin: '0px 0px -6% 0px' });
            }
            document.querySelectorAll('.reveal:not(.in)').forEach(el => revealObserver.observe(el));
        }

                if (h) h.textContent = pad(cd.hours);
                if (m) m.textContent = pad(cd.minutes);
                if (s) s.textContent = pad(cd.seconds);
            });
        }

         *

         * ============================================================ */
        (function () {
            'use strict';
            const BG = {

                rayons: true,        // rayons de lumière qui balaient

                fuji: true,          // ⛰ le mont Fuji, plan dominant du fond

                lune: true,          // lune et son halo

            };
            const body = document.body;
            const layer = (id, on) => {

            const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

            /* ======================================================

            const ENCRE = '#07070a';            // la silhouette, presque noire

            /* ======================================================

            function glowSprite(rgb) {

            /* Le pétale de sakura : deux flancs bombés et une échancrure
