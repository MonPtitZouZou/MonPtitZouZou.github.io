                g.moveTo(0, s * 0.24); g.lineTo(s * 0.38, -s * 0.3);

            }
            function moonSprite(size) {
                const S = Math.round(size * 3.4);
                const c = document.createElement('canvas');
                c.width = c.height = S;
                const g = c.getContext('2d');

            /* ======================================================
             * Décor — rayons, nuages, Fuji, crêtes, village, poteaux
             *
             * Tout est rendu une seule fois à la taille exacte de
             * l'écran. À l'exécution il ne reste que des recopies 1:1,
             * l'opération la moins chère qu'un navigateur sache faire.
             * ====================================================== */
            /* Rayons crépusculaires, en éventail depuis le haut */
            function renderRays(h) {
                const c = document.createElement('canvas');
                c.width = Math.max(1, W); c.height = Math.max(1, Math.round(h));
                const g = c.getContext('2d');
                const ox = W * 0.5, oy = -h * 0.12;
                const R = Math.hypot(W, h) * 1.3;
                g.translate(ox, oy);
                g.fillStyle = 'rgba(255, 226, 170, 0.042)';

                    g.moveTo(0, 0);

            }
            /* Un banc de nuages, tuilable : chaque masse est aussi

            function renderCloudBand(tileW, h, count, colors) {
                const c = document.createElement('canvas');
                c.width = Math.max(1, Math.round(tileW)); c.height = Math.max(1, Math.round(h));
                const g = c.getContext('2d');
                for (let i = 0; i < count; i++) {
                    const cx = rand(0, tileW), cy = rand(h * 0.25, h * 0.8);
                    const rx = rand(tileW * 0.09, tileW * 0.26), ry = rand(h * 0.1, h * 0.24);
                    const col = pick(colors);
                    for (const dx of [-tileW, 0, tileW]) {
                        const grd = g.createRadialGradient(cx + dx, cy, 0, cx + dx, cy, Math.max(rx, ry));
                        grd.addColorStop(0, `rgba(${col},0.085)`);
                        grd.addColorStop(0.55, `rgba(${col},0.035)`);
                        grd.addColorStop(1, `rgba(${col},0)`);

                        g.translate(-(cx + dx), -cy);

                        g.beginPath();
                        g.arc(cx + dx, cy, Math.max(rx, ry), 0, Math.PI * 2);
                        g.fill();

                }
                return { c, w: c.width, h: c.height };
            }
            /* Déplacement de point médian : la même technique que la
               foudre, appliquée à une ligne d'horizon. Deux chargements
               ne donnent jamais la même montagne. */
            function ridgeHeights(levels, h, rough) {
                const n = Math.pow(2, levels) + 1;
                const a = new Float32Array(n);
                a[0] = rand(0.3, 0.75) * h;
                a[n - 1] = rand(0.3, 0.75) * h;
                let step = n - 1, amp = h * 0.46;
                while (step > 1) {
                    const half = step >> 1;
                    for (let i = half; i < n; i += step) {
                        a[i] = (a[i - half] + a[Math.min(n - 1, i + half)]) / 2 + rand(-amp, amp);
                    }
                    step = half;
                    amp *= rough;
                }
                for (let i = 0; i < n; i++) a[i] = Math.max(h * 0.06, Math.min(h * 0.97, a[i]));
                return a;
            }
            function renderRidge(h, fill, rough, rim) {
                const c = document.createElement('canvas');
                c.width = Math.max(1, W); c.height = Math.max(1, Math.round(h));
                const g = c.getContext('2d');
                const a = ridgeHeights(7, h, rough);
                const n = a.length;
                g.beginPath();
                g.moveTo(0, h - a[0]);
                for (let i = 1; i < n; i++) g.lineTo(i / (n - 1) * W, h - a[i]);
                g.lineTo(W, h); g.lineTo(0, h);
                g.closePath();
                g.fillStyle = fill;
                g.fill();
                if (rim) {                                  // liseré de lumière sur la crête
                    g.beginPath();
                    g.moveTo(0, h - a[0]);
                    for (let i = 1; i < n; i++) g.lineTo(i / (n - 1) * W, h - a[i]);
                    g.strokeStyle = rim;
                    g.lineWidth = 1.3;
                    g.stroke();
                }

            /* --- ⛰ LE MONT FUJI ---------------------------------------
               Son galbe ne vient pas d'un triangle : le profil suit une
               puissance < 1, ce qui évase la jupe et redresse les épaules.
               S'y ajoutent le sommet tronqué par le cratère, les ravines
               qui rayonnent depuis la cime, et la neige éternelle dont
               les langues descendent dans ces mêmes ravines.
               Rendu une seule fois, puis simple recopie à chaque image. */
            function renderFuji(w, h) {
                const c = document.createElement('canvas');
                c.width = Math.max(1, Math.round(w));
                c.height = Math.max(1, Math.round(h));
                const g = c.getContext('2d');
                const cx = c.width / 2, halfW = c.width / 2;
                const baseY = c.height;
                const peak = c.height * 0.94;
                const flare = rand(0.54, 0.62);   // < 1 → la jupe s'évase
                const crest = 0.05;               // demi-largeur du sommet tronqué
                const wob = rand(0, 6.28);

                const profile = t => {
                    const a = Math.abs(t);
                    if (a <= crest) {             // le cratère, à peine creusé
                        const k = a / crest;
                        return peak * (1 - 0.014 * (1 - k * k));
                    }
                    const u = (a - crest) / (1 - crest);
                    return peak * (1 - Math.pow(u, flare));
                };

                const N = 260, pts = [];
                for (let i = 0; i <= N; i++) {
                    const t = -1 + (2 * i) / N;
                    const grain = (Math.sin(i * 0.9 + wob) + Math.sin(i * 0.23 + wob * 2)) * 0.9;
                    pts.push({ x: cx + t * halfW, y: baseY - profile(t) + grain });
                }
                const trace = () => {
                    g.beginPath();
                    g.moveTo(pts[0].x, baseY);
                    for (const p of pts) g.lineTo(p.x, p.y);
                    g.lineTo(pts[pts.length - 1].x, baseY);
                    g.closePath();
                };

                trace();                                   // la masse
                const rock = g.createLinearGradient(0, baseY - peak, 0, baseY);
                rock.addColorStop(0, 'rgba(31,25,48,0.92)');
                rock.addColorStop(0.45, 'rgba(21,17,35,0.9)');
                rock.addColorStop(1, 'rgba(12,10,21,0.86)');
                g.fillStyle = rock;
                g.fill();

                g.save();
                trace();
                g.clip();

                g.strokeStyle = 'rgba(8,6,14,0.4)';        // les ravines
                for (let i = 0; i < 26; i++) {
                    const t = rand(-0.92, 0.92);
                    g.lineWidth = rand(0.6, 2.2);
                    g.beginPath();
                    g.moveTo(cx + t * halfW * 0.14, baseY - peak * rand(0.86, 0.99));
                    g.quadraticCurveTo(cx + t * halfW * 0.55, baseY - peak * 0.45,
                                       cx + t * halfW * rand(0.85, 1.05), baseY);
                    g.stroke();
                }

                /* La neige ne coiffe que le dernier quart : plus bas,
                   elle mangerait la silhouette et le Fuji cesserait
                   d'être une masse sombre dans une nuit sombre. */
                const snowY = baseY - peak * rand(0.74, 0.8);
                g.beginPath();
                g.moveTo(0, 0);
                g.lineTo(c.width, 0);
                for (let i = N; i >= 0; i--) {
                    const t = -1 + (2 * i) / N;
                    // élevé au carré : des coulées étroites plutôt que
                    // de grosses festons arrondis
                    const tongue = Math.pow(
                        Math.max(0, Math.sin(i * 0.55 + wob) * 0.6 + Math.sin(i * 0.17) * 0.4), 2);
                    g.lineTo(cx + t * halfW,
                             snowY + tongue * peak * 0.11 + Math.abs(t) * peak * 0.02);
                }
                g.closePath();
                const snow = g.createLinearGradient(0, baseY - peak, 0, snowY + peak * 0.13);
                snow.addColorStop(0, 'rgba(232,230,244,0.62)');
                snow.addColorStop(0.55, 'rgba(196,193,218,0.4)');
                snow.addColorStop(1, 'rgba(160,156,190,0)');
                g.fillStyle = snow;
                g.fill();

                const warm = g.createLinearGradient(cx - halfW * 0.2, 0, cx + halfW, 0);
                warm.addColorStop(0, 'rgba(232,51,46,0)');     // le couchant accroche
                warm.addColorStop(1, 'rgba(255,140,90,0.10)'); // le versant droit
                g.fillStyle = warm;
                g.fillRect(0, 0, c.width, c.height);
                g.restore();

                g.beginPath();                               // liseré de crête
                g.moveTo(pts[0].x, pts[0].y);
                for (const p of pts) g.lineTo(p.x, p.y);
                g.strokeStyle = 'rgba(226,214,232,0.16)';
                g.lineWidth = 1.2;
                g.stroke();

                return { c, w: c.width, h: c.height };
            }
            /* --- Toit japonais : pentes concaves et avant-toits relevés.
                   C'est ce galbe qui remplace le rectangle. --- */
            function roof(g, cx, baseY, halfW, h, flick) {
                g.beginPath();
                g.moveTo(cx - halfW, baseY);
                g.quadraticCurveTo(cx - halfW * 0.42, baseY - h * 0.62, cx, baseY - h);
                g.quadraticCurveTo(cx + halfW * 0.42, baseY - h * 0.62, cx + halfW, baseY);
                g.lineTo(cx + halfW + flick, baseY - flick * 0.85);
                g.lineTo(cx + halfW * 0.82, baseY + h * 0.13);
                g.lineTo(cx - halfW * 0.82, baseY + h * 0.13);
                g.lineTo(cx - halfW - flick, baseY - flick * 0.85);
                g.closePath();
                g.fill();
            }
            function house(g, x, w, groundY, scale, lanterns) {
                const bodyH = rand(0.3, 0.5) * 90 * scale;
                const rH = rand(0.28, 0.42) * 90 * scale;
                g.fillRect(x + w * 0.1, groundY - bodyH, w * 0.8, bodyH);
                roof(g, x + w / 2, groundY - bodyH, w * 0.62, rH, w * 0.09);
                if (Math.random() < 0.35) {                 // une lucarne
                    roof(g, x + w * 0.5, groundY - bodyH - rH * 0.55, w * 0.22, rH * 0.4, w * 0.03);
                }
                /* Un chōchin pendu sous l'avant-toit. Les positions
                   sont collectées ici mais dessinées dans la boucle :
                   ce qui palpite ne peut pas être pré-rendu. */
                if (lanterns && Math.random() < 0.62) {
                    lanterns.push({
                        x: x + w * rand(0.2, 0.8),
                        y: groundY - bodyH + rand(2, 7) * scale,
                        r: rand(2.2, 3.6) * scale,
                        ph: rand(0, 6.28),
                        sp: rand(0.0006, 0.0018)
                    });
                }
            }
            function tower(g, x, w, groundY, scale) {
                const hh = rand(70, 165) * scale;
                g.fillRect(x, groundY - hh, w, hh);
                if (Math.random() < 0.5) g.fillRect(x + w / 2 - 1.5, groundY - hh - rand(14, 34) * scale, 3, rand(14, 34) * scale);
                if (Math.random() < 0.4) g.fillRect(x - w * 0.12, groundY - hh - 4 * scale, w * 1.24, 4 * scale);
            }
            function tree(g, x, w, groundY, scale) {
                const th = rand(26, 54) * scale;
                g.fillRect(x + w * 0.44, groundY - th, w * 0.12, th);
                const cy = groundY - th - w * 0.18;
                for (let i = 0; i < randInt(6, 9); i++) {   // canopée irrégulière
                    g.beginPath();
                    g.arc(x + w / 2 + rand(-w * 0.4, w * 0.4),
                          cy + rand(-w * 0.3, w * 0.22),
                          rand(w * 0.22, w * 0.42), 0, Math.PI * 2);
                    g.fill();
                }
            }
            function pagoda(g, cx, w, groundY, scale) {
                const tiers = randInt(4, 5);
                const tierH = rand(24, 32) * scale;
                let y = groundY;
                for (let i = 0; i < tiers; i++) {
                    const k = 1 - i * 0.13;
                    g.fillRect(cx - w * 0.19 * k, y - tierH * 0.55, w * 0.38 * k, tierH * 0.55);
                    roof(g, cx, y - tierH * 0.55, w * 0.56 * k, tierH * 0.5, w * 0.1 * k);
                    y -= tierH;
                }
                g.fillRect(cx - 2 * scale, y - 26 * scale, 4 * scale, 28 * scale);   // le sōrin
                for (let i = 0; i < 3; i++) {
                    g.fillRect(cx - 6 * scale, y - 20 * scale + i * 6 * scale, 12 * scale, 2 * scale);
                }
            }
            function torii(g, cx, w, groundY, scale) {
                const hh = rand(78, 104) * scale;
                const pw = Math.max(4, w * 0.055);
                g.fillRect(cx - w * 0.3, groundY - hh, pw, hh);
                g.fillRect(cx + w * 0.3 - pw, groundY - hh, pw, hh);
                g.fillRect(cx - w * 0.38, groundY - hh * 0.76, w * 0.76, hh * 0.07);   // nuki
                g.fillRect(cx - w * 0.05, groundY - hh * 1.02, w * 0.1, hh * 0.1);     // gakuzuka
                const y = groundY - hh;                                               // kasagi galbé
                g.beginPath();
                g.moveTo(cx - w * 0.48, y + hh * 0.04);
                g.quadraticCurveTo(cx, y - hh * 0.11, cx + w * 0.48, y + hh * 0.04);
                g.lineTo(cx + w * 0.48, y + hh * 0.11);
                g.quadraticCurveTo(cx, y - hh * 0.03, cx - w * 0.48, y + hh * 0.11);
                g.closePath();
                g.fill();
            }
            /* --- Branche de cerisier en amorce dans le coin.
                   On construit d'abord la géométrie, puis on la rend
                   deux fois : un liseré pâle décalé (la lune est
                   derrière) puis le bois sombre par-dessus. Sans ce
                   contre-jour, une branche noire sur un ciel noir ne
                   se voit pas. --- */
            function buildLimb(x, y, ang, len, w, depth, segs, blooms) {
                const steps = 6;
                let cx = x, cy = y, a = ang;
                for (let i = 0; i < steps; i++) {
                    const l = len / steps;
                    const nx = cx + Math.cos(a) * l, ny = cy + Math.sin(a) * l;
                    segs.push({ x1: cx, y1: cy, x2: nx, y2: ny, w: w * (1 - i / steps * 0.75) });
                    a += rand(-0.24, 0.24) + (depth ? 0.05 : 0.02);
                    cx = nx; cy = ny;
                    if (depth < 2 && i > 1 && Math.random() < 0.5) {
                        buildLimb(cx, cy, a + (Math.random() < 0.5 ? -1 : 1) * rand(0.45, 1),
                            len * rand(0.34, 0.6), w * 0.52, depth + 1, segs, blooms);
                    }
                }
                if (depth >= 1) blooms.push({ x: cx, y: cy, r: w * 2.6 });
                if (depth === 0) blooms.push({ x: cx, y: cy, r: w * 2 });
            }
            function blossom(g, x, y, r) {
                for (let i = 0; i < 5; i++) {
                    const a = i / 5 * Math.PI * 2 + rand(-0.2, 0.2);
                    g.save();
                    g.translate(x + Math.cos(a) * r * 0.5, y + Math.sin(a) * r * 0.5);
                    g.rotate(a);
                    g.beginPath();
                    g.ellipse(0, 0, r * 0.5, r * 0.36, 0, 0, Math.PI * 2);
                    g.fill();
                    g.restore();
                }
                g.save();
                g.fillStyle = 'rgba(255,214,120,0.5)';
                g.beginPath();
                g.arc(x, y, r * 0.18, 0, Math.PI * 2);
                g.fill();
                g.restore();
            }
            function renderBranch(w, h) {
                const c = document.createElement('canvas');
                c.width = Math.max(1, Math.round(w)); c.height = Math.max(1, Math.round(h));
                const g = c.getContext('2d');
                const segs = [], blooms = [];
                buildLimb(-10, h * 0.08, rand(0.34, 0.52), h * 0.95, Math.max(7, h * 0.032), 0, segs, blooms);
                buildLimb(-10, h * 0.2, rand(0.05, 0.2), h * 0.7, Math.max(5, h * 0.022), 0, segs, blooms);
                g.lineCap = 'round';
                g.strokeStyle = 'rgba(226,214,232,0.16)';        // contre-jour lunaire
                for (const s of segs) {
                    g.lineWidth = s.w + 2.4;
                    g.beginPath(); g.moveTo(s.x1 + 1.6, s.y1 - 1.6); g.lineTo(s.x2 + 1.6, s.y2 - 1.6); g.stroke();
                }
                g.strokeStyle = '#0d0b12';                        // le bois
                for (const s of segs) {
                    g.lineWidth = s.w;
                    g.beginPath(); g.moveTo(s.x1, s.y1); g.lineTo(s.x2, s.y2); g.stroke();
                }
                for (const b of blooms) {                         // grappes de fleurs
                    const n = randInt(3, 6);
                    for (let i = 0; i < n; i++) {
                        const bx = b.x + rand(-b.r * 1.6, b.r * 1.6);
                        const by = b.y + rand(-b.r * 1.6, b.r * 1.6);
                        g.fillStyle = pick(['rgba(255,196,210,0.5)', 'rgba(255,224,232,0.42)', 'rgba(246,168,186,0.45)']);
                        blossom(g, bx, by, b.r * rand(0.5, 0.95));
                    }
                }
                return { c, w: c.width, h: c.height };
            }
            function renderTown(h) {
                const c = document.createElement('canvas');
                c.width = Math.max(1, W); c.height = Math.max(1, Math.round(h));
                const g = c.getContext('2d');
                const groundY = c.height - Math.max(6, h * 0.05);
                const scale = Math.min(1.25, Math.max(0.62, h / 190));
                const lanterns = BG.lanternes ? [] : null;
                g.fillStyle = ENCRE;
                const pagodaAt = rand(W * 0.1, W * 0.42);
                const toriiAt = rand(W * 0.56, W * 0.88);
                let pagodaDone = false, toriiDone = false;
                let x = -60;
                while (x < W + 60) {
                    const w = rand(46, 108) * scale;
                    if (!pagodaDone && x + w > pagodaAt) {
                        pagoda(g, x + w * 0.9, w * 1.7, groundY, scale);
                        pagodaDone = true;
                        x += w * 1.9;
                        continue;
                    }
                    if (!toriiDone && x + w > toriiAt) {
                        torii(g, x + w * 0.9, w * 1.8, groundY, scale);
                        if (lanterns) {                    // deux lanternes au torii
                            lanterns.push({ x: x + w * 0.9 - w * 0.5, y: groundY - 82 * scale, r: 3.6 * scale, ph: rand(0, 6.28), sp: 0.0009 });
                            lanterns.push({ x: x + w * 0.9 + w * 0.5, y: groundY - 82 * scale, r: 3.6 * scale, ph: rand(0, 6.28), sp: 0.0011 });
                        }
                        toriiDone = true;
                        x += w * 2;
                        continue;
                    }
                    const r = Math.random();
                    if (r < 0.5) house(g, x, w, groundY, scale, lanterns);
                    else if (r < 0.74) tower(g, x, w * 0.62, groundY, scale);
                    else tree(g, x, w * 0.8, groundY, scale);
                    x += w * rand(0.82, 1.12);
                }
                g.fillRect(0, groundY, c.width, c.height - groundY);   // le sol
                return { c, h: c.height, groundY, lanterns };
            }
            function renderPoles(h) {
                const c = document.createElement('canvas');
                c.width = Math.max(1, W); c.height = Math.max(1, Math.round(h));
                const g = c.getContext('2d');
                const groundY = c.height;
                const scale = Math.min(1.2, Math.max(0.6, h / 240));
                const list = [];
                let x = rand(-80, 40);
                while (x < W + 120) {
                    list.push({ x, h: rand(0.55, 0.95) * h });
                    x += rand(150, 285) * scale;
                }
                g.strokeStyle = ENCRE;                       // les fils, d'abord
                g.lineWidth = 1.3;
                for (let i = 0; i < list.length - 1; i++) {
                    const a = list[i], b = list[i + 1];
                    for (let k = 0; k < 3; k++) {
                        const off = 8 * scale + k * 9 * scale;
                        const y1 = groundY - a.h + off, y2 = groundY - b.h + off;
                        const sag = (b.x - a.x) * rand(0.11, 0.17);
                        g.beginPath();
                        g.moveTo(a.x, y1);
                        g.quadraticCurveTo((a.x + b.x) / 2, (y1 + y2) / 2 + sag, b.x, y2);
                        g.stroke();
                    }
                }
                g.fillStyle = ENCRE;                         // puis les mâts
                for (const p of list) {
                    const top = groundY - p.h;
                    g.fillRect(p.x - 2.4 * scale, top, 4.8 * scale, p.h);
                    for (let k = 0; k < 3; k++) {
                        const y = top + 6 * scale + k * 9 * scale;
                        const armW = (26 - k * 4) * scale;
                        g.fillRect(p.x - armW, y, armW * 2, 2.4 * scale);
                    }
                }
                return { c, h: c.height };
            }
            /* ======================================================
             * Particules
             * ====================================================== */
            function makeStar() {
                return {
                    x: rand(0, W), y: rand(0, H * 0.72),
                    r: rand(0.35, 1.35),
                    base: rand(0.12, 0.7),
                    phase: rand(0, Math.PI * 2),
                    speed: rand(0.0006, 0.0028),
                    cross: false,
                    color: Math.random() < 0.12 ? OR : IVOIRE
                };
            }
            function makeBokeh(fromBottom) {
                return {
                    x: rand(-40, W + 40),
                    y: fromBottom ? rand(H + 30, H + 220) : rand(0, H),
                    size: rand(22, 92),
                    speed: rand(0.06, 0.3),
                    sway: rand(12, 46),
                    swaySpeed: rand(0.0003, 0.0009),
                    phase: rand(0, Math.PI * 2),
                    alpha: rand(0.05, 0.15),
                    pulse: rand(0.0008, 0.0022),
                    color: pick([OR, ROUGE, VIOLET, '255,183,197'])
                };
            }
            /* Les lucioles vivent bas, près du village, et clignotent
               par intermittence au lieu de pulser régulièrement. */
            function makeFirefly() {
                return {
                    x: rand(0, W),
                    y: rand(H * 0.62, H * 0.99),
                    size: rand(5, 13),
                    vx: rand(-0.22, 0.22),
                    vy: rand(-0.14, 0.08),
                    phase: rand(0, Math.PI * 2),
                    speed: rand(0.0012, 0.004),
                    wander: rand(0.001, 0.003),
                    alpha: rand(0.35, 0.9)
                };
            }
            function makePetal(fromTop, blurred) {
                const depth = blurred ? rand(0.9, 1) : Math.random();
                return {
                    x: rand(-30, W + 30),
                    y: fromTop ? rand(-H * 0.45, -30) : rand(0, H),
                    size: blurred ? rand(32, 60) : 13 + depth * 28,
                    depth, blurred,
                    speed: (blurred ? 0.5 : 0.16) + depth * 0.55,
                    sway: rand(24, 70),
                    swaySpeed: rand(0.0004, 0.0013),
                    phase: rand(0, Math.PI * 2),
                    rot: rand(0, Math.PI * 2),
                    rotSpeed: rand(-0.012, 0.012),
                    flip: rand(0, Math.PI * 2),
                    flipSpeed: rand(0.006, 0.018),
                    tilt: rand(0, Math.PI * 2),
                    tiltSpeed: rand(0.003, 0.009),
                    pal: randInt(0, PALETTES.length - 1),
                    alpha: blurred ? rand(0.07, 0.14) : 0.38 + depth * 0.5
                };
            }
            function build() {
                small = W < 700;
                const n = k => Math.round(small ? k * 0.5 : k);
                stars = Array.from({ length: n(BG.etoiles) }, makeStar);
                for (let i = 0; i < Math.min(n(BG.scintillantes), stars.length); i++) {
                    stars[i].cross = true;
                    stars[i].r = rand(1, 1.9);
                    stars[i].base = rand(0.5, 0.9);
                }
                bokeh = Array.from({ length: n(BG.bokeh) }, () => makeBokeh(false));
                fireflies = Array.from({ length: n(BG.lucioles) }, makeFirefly);
                petals = [
                    ...Array.from({ length: n(BG.petales) }, () => makePetal(false, false)),
                    ...Array.from({ length: n(BG.petalesFlous) }, () => makePetal(false, true))
                ];
                scenery.branch = (BG.branche && W > 900)
                    ? renderBranch(W * 0.34, H * 0.46) : null;
                scenery.rays = BG.rayons ? renderRays(Math.max(240, H * 0.72)) : null;
                scenery.cloudFar = BG.nuages
                    ? renderCloudBand(Math.max(W, 900), Math.max(120, H * 0.34), small ? 4 : 7,
                        ['150,132,205', '210,130,120']) : null;
                scenery.cloudNear = BG.nuages
                    ? renderCloudBand(Math.max(W * 0.8, 700), Math.max(100, H * 0.26), small ? 3 : 6,
                        ['232,120,90', '232,51,46', '160,140,210']) : null;
                /* Le Fuji : 1,3 × la largeur de l'écran, donc il déborde
                   des deux côtés — c'est ce débordement qui donne
                   l'échelle. Sa base sera masquée par les crêtes. */
                scenery.fuji = BG.fuji
                    ? renderFuji(W * 1.3, Math.max(200, H * 0.6)) : null;
                scenery.mountFar = BG.montagnes
                    ? renderRidge(Math.max(120, H * 0.34), 'rgba(33,27,52,0.75)', 0.56, 'rgba(150,124,205,0.10)') : null;
                scenery.mountNear = BG.montagnes
                    ? renderRidge(Math.max(90, H * 0.24), 'rgba(18,14,30,0.94)', 0.62, 'rgba(232,51,46,0.13)') : null;
                scenery.town = BG.village ? renderTown(Math.max(120, H * 0.2)) : null;
                scenery.poles = BG.poteaux ? renderPoles(Math.max(150, H * 0.3)) : null;
                if (BG.lune) {
                    const size = Math.max(48, Math.min(W, H) * 0.1);
                    scenery.moon = { c: moonSprite(size), size, x: W * rand(0.72, 0.86), y: H * rand(0.07, 0.13) };
                }
            }
            function resize() {
                dpr = Math.min(window.devicePixelRatio || 1, 2);
                W = window.innerWidth;
                H = window.innerHeight;
                canvas.width = W * dpr;
                canvas.height = H * dpr;
                canvas.style.width = W + 'px';
                canvas.style.height = H + 'px';
                ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
                build();
            }
            if (!sprites.petal.length) {
                PALETTES.forEach(p => {
                    sprites.petal.push(petalSprite(p, 0));
                    sprites.petalBlur.push(petalSprite(p, 2.2));
                });
            }
            window.addEventListener('scroll', () => {
                const d = window.scrollY - lastScroll;
                lastScroll = window.scrollY;
                scrollPush = Math.max(-16, Math.min(16, scrollPush + d * 0.07));
            }, { passive: true });
            window.addEventListener('resize', resize);
            /* ======================================================
             * Rendus
             * ====================================================== */
            function drawStars(t) {
                ctx.globalCompositeOperation = 'lighter';
                for (const s of stars) {
                    const a = s.base * (0.55 + 0.45 * Math.sin(t * s.speed + s.phase));
                    ctx.fillStyle = `rgba(${s.color},${a})`;
                    ctx.beginPath();
                    ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
                    ctx.fill();
                    if (s.cross) {
                        const L = s.r * 9 * (0.6 + 0.4 * a);
                        ctx.strokeStyle = `rgba(${s.color},${a * 0.4})`;
                        ctx.lineWidth = 0.8;
                        ctx.beginPath();
                        ctx.moveTo(s.x - L, s.y); ctx.lineTo(s.x + L, s.y);
                        ctx.moveTo(s.x, s.y - L); ctx.lineTo(s.x, s.y + L);
                        ctx.stroke();
                    }
                }
                ctx.globalCompositeOperation = 'source-over';
            }
            function drawBokeh(t, dt) {
                ctx.globalCompositeOperation = 'lighter';
                for (const b of bokeh) {
                    b.y -= b.speed * dt;
                    if (b.y < -b.size) Object.assign(b, makeBokeh(true));
                    const x = b.x + Math.sin(t * b.swaySpeed + b.phase) * b.sway;
                    ctx.globalAlpha = b.alpha * (0.7 + 0.3 * Math.sin(t * b.pulse + b.phase));
                    ctx.drawImage(glowSprite(b.color), x - b.size / 2, b.y - b.size / 2, b.size, b.size);
                }
                ctx.globalAlpha = 1;
                ctx.globalCompositeOperation = 'source-over';
            }
            function drawFireflies(t, dt) {
                ctx.globalCompositeOperation = 'lighter';
                const sp = glowSprite(OR);
                for (const f of fireflies) {
                    f.x += (f.vx + Math.sin(t * f.wander + f.phase) * 0.25) * dt;
                    f.y += (f.vy + Math.cos(t * f.wander * 1.3 + f.phase) * 0.18) * dt;
                    if (f.x < -20) f.x = W + 20;
                    if (f.x > W + 20) f.x = -20;
                    if (f.y < H * 0.55 || f.y > H + 20) Object.assign(f, makeFirefly());
                    // clignotement : une sinusoïde durcie, donc des éclats brefs
                    const s = Math.sin(t * f.speed + f.phase);
                    const a = f.alpha * Math.max(0, Math.pow((s + 1) / 2, 3.5));
                    if (a < 0.01) continue;
                    ctx.globalAlpha = a;
                    ctx.drawImage(sp, f.x - f.size / 2, f.y - f.size / 2, f.size, f.size);
                }
                ctx.globalAlpha = 1;
                ctx.globalCompositeOperation = 'source-over';
            }
            /* Un pétale culbute sur deux axes. On simule l'axe qui nous
               fait face par un scaleX, et on assombrit quand il passe
               de profil — sans ça, il a l'air d'un autocollant. */
            function drawPetal(p, t) {
                const x = p.x + Math.sin(t * p.swaySpeed + p.phase) * p.sway;
                let sx = Math.cos(p.flip);
                const face = Math.abs(sx);
                if (face < 0.07) sx = 0.07 * (sx < 0 ? -1 : 1);
                const sy = 0.86 + 0.14 * Math.cos(p.tilt);
                const sp = p.blurred ? sprites.petalBlur[p.pal] : sprites.petal[p.pal];
                ctx.save();
                ctx.translate(x, p.y);
                ctx.rotate(p.rot);
                ctx.scale(sx, sy);
                ctx.globalAlpha = p.alpha * (0.34 + 0.66 * face);
                ctx.drawImage(sp, -p.size / 2, -p.size / 2, p.size, p.size);
                ctx.restore();
                ctx.globalAlpha = 1;
            }
            function spawnShooting(t) {
                const fromLeft = Math.random() < 0.5;
                const ang = fromLeft ? rand(0.25, 0.55) : Math.PI - rand(0.25, 0.55);
                const sp = rand(11, 19);
                shooting.push({
                    x: fromLeft ? rand(-W * 0.15, W * 0.55) : rand(W * 0.45, W * 1.15),
                    y: rand(-40, H * 0.32),
                    vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp,
                    life: 0, max: rand(60, 105), trail: [],
                    color: Math.random() < 0.25 ? OR : IVOIRE
                });
                nextShoot = t + rand(9000, 24000);
            }
            function drawShooting(dt) {
                ctx.globalCompositeOperation = 'lighter';
                for (let i = shooting.length - 1; i >= 0; i--) {
                    const s = shooting[i];
                    s.x += s.vx * dt; s.y += s.vy * dt; s.life += dt;
                    s.trail.unshift({ x: s.x, y: s.y });
                    if (s.trail.length > 22) s.trail.pop();
                    const fade = s.life < 10 ? s.life / 10
                               : Math.max(0, 1 - (s.life - 10) / (s.max - 10));
                    ctx.lineCap = 'round';
                    for (let j = 0; j < s.trail.length - 1; j++) {
                        const k = 1 - j / s.trail.length;
                        ctx.strokeStyle = `rgba(${s.color},${fade * k * k * 0.75})`;
                        ctx.lineWidth = k * 2.4;
                        ctx.beginPath();
                        ctx.moveTo(s.trail[j].x, s.trail[j].y);
                        ctx.lineTo(s.trail[j + 1].x, s.trail[j + 1].y);
                        ctx.stroke();
                    }
                    ctx.fillStyle = `rgba(255,255,255,${fade * 0.9})`;
                    ctx.beginPath();
                    ctx.arc(s.x, s.y, 1.6, 0, Math.PI * 2);
                    ctx.fill();
                    if (s.life > s.max || s.x < -W * 0.3 || s.x > W * 1.3 || s.y > H * 1.2) {
                        shooting.splice(i, 1);
                    }
                }
                ctx.globalCompositeOperation = 'source-over';
            }
            /* --- Une volée d'oiseaux ---
               Rare, et c'est ce qui fait qu'on la remarque. La
               formation est décalée en escalier, chaque oiseau bat
               des ailes à son propre rythme : synchronisés, ils
               feraient mécanique. */
            function spawnBirds(t) {
                const dir = Math.random() < 0.5 ? 1 : -1;
                const n = randInt(5, 9);
                const y0 = rand(H * 0.1, H * 0.4);
                const sp = rand(0.5, 0.95);
                const drop = Math.random() < 0.5 ? 1 : -1;
                birds = [];
                for (let i = 0; i < n; i++) {
                    birds.push({
                        x: (dir > 0 ? -70 : W + 70) - dir * i * rand(16, 30),
                        y: y0 + i * rand(3.5, 9) * drop + rand(-5, 5),
                        dir, sp: sp * rand(0.94, 1.06),
                        size: rand(3.4, 6.2),
                        ph: rand(0, 6.28),
                        flap: rand(0.005, 0.011)
                    });
                }
                nextBirds = t + rand(40000, 82000);
            }
            function drawBirds(t, dt) {
                ctx.strokeStyle = `rgba(${IVOIRE},0.26)`;
                ctx.lineWidth = 1.1;
                ctx.lineCap = 'round';
                for (let i = birds.length - 1; i >= 0; i--) {
                    const b = birds[i];
                    b.x += b.dir * b.sp * dt * 1.5;
                    b.y += Math.sin(t * 0.0006 + b.ph) * 0.06 * dt;
                    if (b.x < -110 || b.x > W + 110) { birds.splice(i, 1); continue; }
                    const w = b.size;
                    const up = Math.sin(t * b.flap + b.ph) * w * 0.62;
                    ctx.beginPath();
                    ctx.moveTo(b.x - w, b.y - up * 0.25);
                    ctx.quadraticCurveTo(b.x - w * 0.5, b.y - up, b.x, b.y);
                    ctx.quadraticCurveTo(b.x + w * 0.5, b.y - up, b.x + w, b.y - up * 0.25);
                    ctx.stroke();
                }
            }
            /* --- Les chōchin du village ---
               Un cœur chaud sur un halo, et une respiration lente
               propre à chaque lanterne. */
            function drawLanterns(t, topY) {
                const list = scenery.town && scenery.town.lanterns;
                if (!list || !list.length) return;
                const sp = glowSprite('255,146,74');
                ctx.globalCompositeOperation = 'lighter';
                for (const L of list) {
                    const a = 0.55 + 0.45 * Math.sin(t * L.sp + L.ph);
                    const s = L.r * (7 + a * 1.6);
                    ctx.globalAlpha = 0.3 + 0.32 * a;
                    ctx.drawImage(sp, L.x - s / 2, topY + L.y - s / 2, s, s);
                    ctx.globalAlpha = 0.55 + 0.4 * a;
                    ctx.fillStyle = 'rgba(255,206,150,0.95)';
                    ctx.beginPath();
                    ctx.ellipse(L.x, topY + L.y, L.r * 0.5, L.r * 0.7, 0, 0, Math.PI * 2);
                    ctx.fill();
                }
                ctx.globalAlpha = 1;
                ctx.globalCompositeOperation = 'source-over';
            }
            function spawnFlash(t) {
                const span = Math.hypot(W, H);
                flash = {
                    t0: t, dur: rand(850, 1400),
                    angle: (Math.random() < 0.5 ? -1 : 1) * rand(0.18, 0.42),
                    dir: Math.random() < 0.5 ? -1 : 1, span,
                    lines: Array.from({ length: 44 }, () => ({
                        y: rand(-span * 0.5, span * 0.5),
                        len: span * rand(0.2, 0.65),
                        w: rand(0.5, 2), a: rand(0.25, 1), off: Math.random()
                    }))
                };
                gustTarget += rand(1.4, 2.6) * -flash.dir;   // le souffle emporte les pétales
                nextFlash = t + rand(22000, 45000);
            }
            function drawFlash(t) {
                if (!flash) return;
                const k = (t - flash.t0) / flash.dur;
                if (k >= 1) { flash = null; return; }
                const fade = Math.sin(k * Math.PI);
                const span = flash.span;
                ctx.save();
                ctx.translate(W / 2, H / 2);
                ctx.rotate(flash.angle);
                ctx.lineCap = 'round';
                for (const l of flash.lines) {
                    const x = (-span * 0.75 + l.off * span * 0.5 + k * span * 1.5) * flash.dir;
                    ctx.strokeStyle = `rgba(${IVOIRE},${fade * l.a * 0.08})`;
                    ctx.lineWidth = l.w;
                    ctx.beginPath();
                    ctx.moveTo(x, l.y);
                    ctx.lineTo(x + l.len * flash.dir, l.y);
                    ctx.stroke();
                }
                ctx.restore();
            }
            /* ======================================================
             * La boucle
             * ====================================================== */
            let last = 0;
            function loop(t) {
                requestAnimationFrame(loop);
                if (document.hidden) { last = t; return; }
                const dt = Math.min(t - last, 50) / 16.67;   // normalisé sur 60 fps
                last = t;
                ctx.clearRect(0, 0, W, H);
                /* -- Parallaxe : chaque plan glisse à sa propre vitesse -- */
                const par = Math.min(window.scrollY, 1500);
                if (scenery.rays) {
                    // respiration lente plutôt qu'une rotation : pas de
                    // rééchantillonnage, donc une recopie directe
                    ctx.globalAlpha = 0.72 + 0.28 * Math.sin(t * 0.00007);
                    ctx.drawImage(scenery.rays.c, 0, 0);
                    ctx.globalAlpha = 1;
                }
                if (scenery.moon) {
                    const m = scenery.moon;
                    ctx.drawImage(m.c, m.x - m.c.width / 2, m.y - m.c.height / 2 - par * 0.006);
                }
                if (stars.length) drawStars(t);
                if (scenery.cloudFar) {
                    const b = scenery.cloudFar;
                    const off = (t * 0.0072) % b.w;
                    const y = H * 0.3 - par * 0.016;
                    ctx.drawImage(b.c, -off, y);
                    ctx.drawImage(b.c, -off + b.w, y);
                }
                /* ⛰ Le Fuji, juste devant les nuages lointains.
                   Sa parallaxe (0,008) est la plus lente du décor :
                   c'est elle qui le fait lire comme très éloigné,
                   donc très grand. Les nuages proches lui passent
                   devant, les crêtes lui mangent la base. */
                if (scenery.fuji) {
                    const f = scenery.fuji;
                    ctx.drawImage(f.c, W * 0.37 - f.w / 2, H * 0.9 - f.h - par * 0.008);
                }
                if (scenery.cloudNear) {
                    const b = scenery.cloudNear;
                    const off = (t * 0.0155) % b.w;
                    const y = H * 0.5 - par * 0.03;
                    ctx.drawImage(b.c, off - b.w, y);
                    ctx.drawImage(b.c, off, y);
                    if (off < W) ctx.drawImage(b.c, off + b.w, y);
                }
                if (BG.filantes) {
                    if (t > nextShoot) spawnShooting(t);
                    if (shooting.length) drawShooting(dt);
                }
                if (BG.oiseaux) {
                    if (!birds.length && t > nextBirds) spawnBirds(t);
                    if (birds.length) drawBirds(t, dt);
                }
                if (scenery.mountFar) {
                    const l = scenery.mountFar;
                    ctx.drawImage(l.c, 0, H - l.h - H * 0.085 - par * 0.012);
                }
                if (scenery.mountNear) {
                    const l = scenery.mountNear;
                    ctx.drawImage(l.c, 0, H - l.h - H * 0.035 - par * 0.024);
                }
                /* Brume de vallée : sépare les montagnes du village */
                const haze = ctx.createLinearGradient(0, H * 0.62, 0, H);
                haze.addColorStop(0, 'rgba(232,51,46,0)');
                haze.addColorStop(0.6, 'rgba(232,51,46,0.035)');
                haze.addColorStop(1, 'rgba(255,140,60,0.08)');
                ctx.fillStyle = haze;
                ctx.fillRect(0, H * 0.62, W, H * 0.38);
                if (bokeh.length) drawBokeh(t, dt);
                if (scenery.town) {
                    const dy = par * 0.038;
                    const topY = H - scenery.town.h - dy;
                    ctx.drawImage(scenery.town.c, 0, topY);
                    ctx.fillStyle = ENCRE;
                    ctx.fillRect(0, H - dy - 2, W, dy + 4);
                    drawLanterns(t, topY);
                }
                if (scenery.poles) {
                    const dy = par * 0.062;
                    ctx.drawImage(scenery.poles.c, 0, H - scenery.poles.h - dy);
                }
                if (scenery.branch) {
                    ctx.drawImage(scenery.branch.c, 0, -par * 0.09);
                }
                if (fireflies.length) drawFireflies(t, dt);
                /* -- Rafales : le vent monte, tient, puis retombe -- */
                if (BG.rafales) {
                    if (t > nextGust) {
                        gustTarget = rand(-2.8, 2.8);
                        nextGust = t + rand(7000, 17000);
                    }
                    gustTarget *= 0.985;
                    gust += (gustTarget - gust) * 0.03 * dt;
                }
                scrollPush *= 0.93;
                for (const p of petals) {
                    p.y += (p.speed + scrollPush * p.depth * 0.5) * dt;
                    p.x += gust * (0.35 + p.depth) * dt;
                    p.rot += (p.rotSpeed + gust * 0.004) * dt;
                    p.flip += p.flipSpeed * dt;
                    p.tilt += p.tiltSpeed * dt;
                    if (p.y > H + 80) Object.assign(p, makePetal(true, p.blurred));
                    else if (p.y < -H * 0.55) p.y = H + 30;
                    if (p.x < -60) p.x = W + 50;
                    else if (p.x > W + 60) p.x = -50;
                    drawPetal(p, t);
                }
                if (BG.lignesVitesse) {
                    if (!flash && t > nextFlash) spawnFlash(t);
                    drawFlash(t);
                }
            }
            resize();
            requestAnimationFrame(loop);
        })();
    </script>
</body>
</html>
