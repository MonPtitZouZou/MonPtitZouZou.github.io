name: 🎂 Anniversaires

on:
  schedule:
    # 23h17 UTC = 01h17 à Paris en été, 00h17 en hiver.
    # Dans les deux cas on est déjà passé au jour suivant côté Paris,
    # donc la date reste correcte même avec du retard.
    - cron: '17 23 * * *'

  # Lancement manuel depuis l'onglet Actions (pratique pour tester)
  workflow_dispatch:
    inputs:
      test_date:
        description: 'Date de test au format JJ/MM. Laisser vide pour la date du jour.'
        required: false
        default: ''

jobs:
  check-birthdays:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Vérifier les anniversaires du jour
        env:
          # Salon principal (obligatoire)
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          # Salons supplémentaires (facultatifs : crée le secret et ça marche)
          DISCORD_WEBHOOK_2: ${{ secrets.DISCORD_WEBHOOK_2 }}
          TEST_DATE: ${{ github.event.inputs.test_date }}
        run: node scripts/birthday-check.js
